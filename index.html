<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKR Suite Piacentini</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1f2e;min-height:100vh;display:flex}
:root{--orange:#e8621a;--orange-light:#fff3ec;--orange-border:#fcd7bc;--blue:#1a4fa0;--blue-light:#e8f0fb;--gray-dark:#2d3142;--gray-mid:#6b7280;--gray-lighter:#f7f8fa;--white:#fff;--border:#e2e5eb;--border2:#d1d5de;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--nav-w:230px}
nav{width:var(--nav-w);min-height:100vh;background:var(--gray-dark);display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100}
.nl{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.ni{width:34px;height:34px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
.nt{font-weight:700;font-size:15px;color:#fff}.ns{font-size:10px;color:rgba(255,255,255,.4)}
.sec{padding:14px 14px 4px;font-size:10px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,.3);text-transform:uppercase}
.nm{display:flex;align-items:center;gap:10px;padding:9px 14px;margin:1px 8px;border-radius:8px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.6);transition:all .15s}
.nm:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.nm.active{background:var(--orange);color:#fff}
.nicon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
.nm.active .nbadge{background:rgba(255,255,255,.3)}
.nb{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.nu{display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px;border-radius:8px}
.nu:hover{background:rgba(255,255,255,.07)}
.nav-av{width:34px;height:34px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden}
.nav-av img{width:100%;height:100%;object-fit:cover}
.nav-un{font-size:12px;font-weight:600;color:#fff}
.nav-ur{font-size:10px;color:rgba(255,255,255,.4)}
main{margin-left:var(--nav-w);flex:1;background:#f0f2f5;min-height:100vh}
.ph{padding:24px 28px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pt{font-size:20px;font-weight:700;color:var(--gray-dark)}
.ps{font-size:13px;color:var(--gray-mid);margin-top:2px}
.cnt{padding:20px 28px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.bp{background:var(--orange);color:#fff}.bp:hover{background:#d0561a}
.bg{background:var(--white);color:var(--gray-mid);border:1px solid var(--border2)}.bg:hover{background:var(--gray-lighter)}
.bsm{padding:5px 12px;font-size:12px}
.bsc{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.bsd{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px}
.ch{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ct{font-size:13px;font-weight:700;color:var(--gray-dark)}
.cb{padding:18px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.ml{font-size:11px;color:var(--gray-mid);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.mv{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--gray-dark)}
.fb{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.fl{font-size:12px;font-weight:600;color:var(--gray-mid);white-space:nowrap}
.fs{background:var(--gray-lighter);border:1px solid var(--border2);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--gray-dark);cursor:pointer;font-family:inherit}
.fd{width:1px;height:20px;background:var(--border2)}
.pb{height:7px;background:#eee;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;transition:width .4s}
.pg{background:var(--success)}.po{background:var(--orange)}.pr{background:var(--danger)}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.bg2{background:#dcfce7;color:#166534}.by{background:#fef9c3;color:#854d0e}
.br{background:#fef2f2;color:#991b1b}.bb{background:var(--blue-light);color:var(--blue)}
.bor{background:var(--orange-light);color:#92400e}.bgr{background:#f3f4f6;color:#374151}
.bpu{background:#f5f3ff;color:#6d28d9}
.bdot{width:5px;height:5px;border-radius:50%;background:currentColor}
.hd{width:10px;height:10px;border-radius:50%;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:9px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--gray-lighter)}
td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--gray-dark);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.tabs{display:flex;background:#edf0f5;border-radius:8px;padding:3px;margin-bottom:18px;width:fit-content}
.tab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;color:var(--gray-mid);transition:all .15s;white-space:nowrap}
.tab.active{background:var(--white);color:var(--orange);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fg{margin-bottom:14px}
.flb{font-size:12px;font-weight:600;color:var(--gray-dark);margin-bottom:5px;display:block}
.fi,.fsl,.fta{width:100%;background:var(--white);border:1px solid var(--border2);border-radius:8px;padding:8px 11px;font-size:13px;color:var(--gray-dark);outline:none;transition:border .15s;font-family:inherit}
.fi:focus,.fsl:focus,.fta:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,98,26,.1)}
.fta{resize:vertical;min-height:72px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.ua{border:2px dashed var(--border2);border-radius:10px;padding:24px;text-align:center;cursor:pointer;background:var(--gray-lighter)}
.ua:hover{border-color:var(--orange);background:var(--orange-light)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto}
.md{background:var(--white);border-radius:14px;width:580px;max-width:95vw;border:1px solid var(--border);margin-bottom:40px}
.mh{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:15px;font-weight:700;color:var(--gray-dark)}
.mbd{padding:22px;max-height:65vh;overflow-y:auto}
.mf{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.mc2{width:28px;height:28px;border-radius:6px;background:var(--gray-lighter);border:none;cursor:pointer;color:var(--gray-mid);font-size:18px;display:flex;align-items:center;justify-content:center}
.oi{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.oh{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s;border-radius:10px}
.oh:hover{background:var(--gray-lighter)}
.on{font-size:13px;font-weight:700;color:var(--gray-dark);margin-bottom:3px}
.om{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--gray-mid);flex-wrap:wrap}
.chv{font-size:12px;color:var(--gray-mid);transition:transform .2s;flex-shrink:0}
.chv.open{transform:rotate(90deg)}
.oc{padding:0 14px 14px;display:none}
.oc.open{display:block}
.kr{background:var(--gray-lighter);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:7px;display:flex;align-items:center;gap:12px}
.ld{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--gray-mid);font-size:14px;gap:10px}
.sp{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--gray-dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .3s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
.uc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.uc:hover{border-color:var(--orange);background:var(--orange-light)}
.area-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .15s}
.area-card:hover{border-color:var(--orange);background:var(--orange-light)}
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin-bottom:16px}
.rrow{background:var(--white);border:1px solid var(--border);border-radius:9px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#d1d5de;border-radius:3px}
</style>
</head>
<body>
<nav>
  <div class="nl"><div class="ni">O</div><div><div class="nt">OKR Suite</div><div class="ns">Piacentini</div></div></div>
  <div class="sec">Principal</div>
  <div class="nm active" onclick="go('dashboard')"><span class="nicon">⊞</span> Dashboard</div>
  <div class="nm" onclick="go('ranking')"><span class="nicon">🏆</span> Ranking</div>
  <div class="sec">Cadastros</div>
  <div class="nm" onclick="go('areas')"><span class="nicon">🏬</span> Áreas</div>
  <div class="nm" onclick="go('usuarios')"><span class="nicon">👥</span> Usuários</div>
  <div class="sec">OKRs</div>
  <div class="nm" onclick="go('company-okrs')"><span class="nicon">🏢</span> OKR Companhia</div>
  <div class="nm" onclick="go('area-okrs')"><span class="nicon">📋</span> OKR por Área</div>
  <div class="nm" onclick="go('key-results')"><span class="nicon">📊</span> Key Results</div>
  <div class="nm" onclick="go('initiatives')"><span class="nicon">✅</span> Iniciativas</div>
  <div class="sec">Manutenção</div>
  <div class="nm" onclick="go('manutencao')"><span class="nicon">🔄</span> Atualizar Status</div>
  <div class="sec">Admin</div>
  <div class="nm" onclick="go('approvals')"><span class="nicon">✔</span> Aprovações <span class="nbadge" id="bc">0</span></div>
  <div class="nb">
    <div class="nu" onclick="go('usuarios')">
      <div class="nav-av" id="nav-av">A</div>
      <div><div class="nav-un" id="nav-nm">Admin</div><div class="nav-ur" id="nav-rl">Administrador</div></div>
    </div>
  </div>
</nav>
<main id="main"></main>
<div id="mr"></div>
<div class="toast" id="toast"></div>
<script>
const GAS='https://script.google.com/macros/s/AKfycbwnAdAcSaTnD6BxKYBxgsRwZqRbi1oSZsEZ00qe7m7cD4mpe8NYhojDiLt3F3dNOq8_wQ/exec';
const MOS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const STATUS_INIT=['Não iniciada','Em andamento','Concluída','Cancelada','Pausada','Concluída com atraso'];
const CORS=['#e8621a','#1a4fa0','#16a34a','#7c3aed','#0891b2','#dc2626','#d97706','#0d9488'];

// Cache global
let _users=[], _areas=[], _aokrs=[], _cokrs=[], _krs=[], _inits=[], _snaps=[];

function toast(msg,t='ok'){const e=document.getElementById('toast');e.textContent=msg;e.className=`toast show ${t}`;setTimeout(()=>e.className='toast',3500)}

// Codificação base64 para suportar acentos e caracteres especiais
function enc(obj){
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}
  catch(e){return btoa(JSON.stringify(obj))}
}
function dec(s){
  try{return JSON.parse(decodeURIComponent(escape(atob(s))))}
  catch(e){return JSON.parse(s)}
}

async function apiG(aba){
  try{const r=await fetch(`${GAS}?acao=listar&aba=${aba}`);return(await r.json()).dados||[]}
  catch(e){console.error(e);return[]}
}
async function apiP(aba,body){
  try{const r=await fetch(`${GAS}?acao=criar&aba=${aba}&body=${enc(body)}&enc=b64`);return await r.json()}
  catch(e){return{ok:false,erro:e.message}}
}
async function apiU(aba,body){
  try{const r=await fetch(`${GAS}?acao=atualizar&aba=${aba}&body=${enc(body)}&enc=b64`);return await r.json()}
  catch(e){return{ok:false,erro:e.message}}
}
async function apiSnap(body){
  try{const r=await fetch(`${GAS}?acao=snapshot&aba=snapshots&body=${enc(body)}&enc=b64`);return await r.json()}
  catch(e){return{ok:false,erro:e.message}}
}

// Carrega todos os dados em cache
async function loadAll(){
  [_users,_areas,_aokrs,_cokrs,_krs,_inits,_snaps]=await Promise.all([
    apiG('usuarios'),apiG('areas'),apiG('okr_area'),apiG('okr_companhia'),
    apiG('key_results'),apiG('iniciativas'),apiG('snapshots')
  ]);
}

function hc(p){p=parseInt(p)||0;return p>=60?'pg':p>=40?'po':'pr'}
function pb(p,w){p=parseInt(p)||0;const s=w?`style="width:${w}"`:''
;return`<div class="pb" ${s}><div class="pf ${hc(p)}" style="width:${Math.min(p,100)}%"></div></div>`}
function bdg(t){const m={'Publicado':'bg2','Pendente':'by','Em andamento':'bb','Concluída':'bg2','Não iniciada':'bgr','Cancelada':'br','Aprovado':'bg2','Reprovado':'br','Concluída com atraso':'by','Pausada':'bpu','ADM':'bor','CEO':'bb','GESTOR':'bg2','sim':'bg2'};return`<span class="bdg ${m[t]||'bgr'}">${t}</span>`}
function hbdg(h){const m={green:'bg2',yellow:'by',red:'br'};const l={green:'No prazo',yellow:'Atenção',red:'Em risco'};return`<span class="bdg ${m[h]||'bgr'}"><span class="bdot"></span>${l[h]||h}</span>`}
function ld(){return`<div class="ld"><div class="sp"></div> Carregando dados...</div>`}
function ini(n){return(n||'?').split(' ').map(x=>x[0]||'').slice(0,2).join('').toUpperCase()||'?'}
function corN(n){let h=0;for(let c of(n||''))h=(h*31+c.charCodeAt(0))%CORS.length;return CORS[h]}
function av(n,s=36,foto=''){
  if(foto)return`<div style="width:${s}px;height:${s}px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${foto}" style="width:100%;height:100%;object-fit:cover"></div>`;
  return`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${corN(n)};display:flex;align-items:center;justify-content:center;font-size:${Math.round(s*.3)}px;font-weight:800;color:#fff;flex-shrink:0">${ini(n)}</div>`
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;')}
function mesOpts(sel){return MOS.map((m,i)=>`<option value="${i+1}"${parseInt(sel)===i+1?' selected':''}>${m}</option>`).join('')}
function anoOpts(){const y=new Date().getFullYear();return[y-1,y,y+1].map(a=>`<option value="${a}"${a===y?' selected':''}>${a}</option>`).join('')}
function userOpts(selNome){return`<option value="">— Selecione —</option>`+_users.map(u=>`<option value="${esc(u.nome)}"${u.nome===selNome?' selected':''}>${u.nome} (${u.area||''})</option>`).join('')}
function areaOpts(sel){return`<option value="">Todas as Áreas</option>`+_areas.filter(a=>a.ativo!=='não').map(a=>`<option value="${esc(a.nome)}"${a.nome===sel?' selected':''}>${a.nome}</option>`).join('')}

function snapAteMes(tipo,item_id,mes,ano){
  const rel=_snaps.filter(s=>s.tipo===tipo&&s.item_id==item_id&&(parseInt(s.ano)<parseInt(ano)||(parseInt(s.ano)===parseInt(ano)&&parseInt(s.mes)<=parseInt(mes))));
  if(!rel.length)return null;
  return rel.sort((a,b)=>(parseInt(b.ano)*12+parseInt(b.mes))-(parseInt(a.ano)*12+parseInt(a.mes)))[0];
}

function go(p){
  document.querySelectorAll('.nm').forEach(n=>n.classList.remove('active'));
  const idx={dashboard:0,ranking:1,areas:3,usuarios:4,'company-okrs':6,'area-okrs':7,'key-results':8,initiatives:9,manutencao:11,approvals:13};
  const items=document.querySelectorAll('.nm');
  if(items[idx[p]])items[idx[p]].classList.add('active');
  ({dashboard:pDash,ranking:pRank,areas:pAreas,usuarios:pUsers,'company-okrs':pCOkr,'area-okrs':pAOkr,'key-results':pKR,initiatives:pInit,manutencao:pMaint,approvals:pApprov})[p]?.()
}
function openM(h){document.getElementById('mr').innerHTML=`<div class="mo" onclick="if(event.target===this)closeM()">${h}</div>`}
function closeM(){document.getElementById('mr').innerHTML=''}

// ══════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════
async function pDash(){
  const now=new Date();
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">Dashboard Executivo</div><div class="ps">Acompanhamento estratégico com histórico mensal</div></div></div>
  <div class="cnt">
    <div class="fb">
      <span class="fl">🔍 Área:</span>
      <select class="fs" id="fa" onchange="lDash()">${areaOpts('')}</select>
      <div class="fd"></div>
      <span class="fl">📅 Mês:</span>
      <select class="fs" id="fmes" onchange="lDash()">${mesOpts(now.getMonth()+1)}</select>
      <select class="fs" id="fano" onchange="lDash()">${anoOpts()}</select>
    </div>
    <div id="dc">${ld()}</div>
  </div>`;
  await loadAll();
  lDash();
}

function lDash(){
  const af=document.getElementById('fa')?.value||'';
  const mes=parseInt(document.getElementById('fmes')?.value)||new Date().getMonth()+1;
  const ano=parseInt(document.getElementById('fano')?.value)||new Date().getFullYear();
  const mesLabel=`${MOS[mes-1]}/${ano}`;
  const el=document.getElementById('dc');if(!el)return;

  // OKRs da área filtrada
  const aokrsFiltrados=af?_aokrs.filter(o=>o.area===af):_aokrs;

  // Para cada OKR da companhia, calcula % de OKRs de área vinculados da área filtrada
  const cokrsComPct=_cokrs.map(co=>{
    const totalVinc=_aokrs.filter(ao=>ao.okr_companhia_id==co.id).length;
    const daArea=af?_aokrs.filter(ao=>ao.okr_companhia_id==co.id&&ao.area===af).length:totalVinc;
    const pct=totalVinc>0?Math.round((daArea/totalVinc)*100):0;
    return{...co,_totalVinc:totalVinc,_daArea:daArea,_pctArea:pct};
  });

  // OKRs da área com snapshot do mês
  const aokrsComSnap=aokrsFiltrados.map(ao=>{
    const snap=snapAteMes('okr_area',ao.id,mes,ano);
    return{...ao,_snapProg:snap?parseInt(snap.pct)||0:parseInt(ao.progresso)||0,_snapSaude:snap?snap.saude:ao.saude||'green'};
  });

  const pend=_users.length>0?0:0; // aprovações pendentes
  const totalProg=aokrsComSnap.length?Math.round(aokrsComSnap.reduce((s,o)=>s+o._snapProg,0)/aokrsComSnap.length):0;

  el.innerHTML=`
  <div class="mg">
    <div class="mc"><div style="font-size:28px;margin-bottom:8px">📊</div><div class="ml">Progresso — ${mesLabel}</div><div class="mv" style="color:var(--orange)">${totalProg}%</div><div style="margin-top:8px">${pb(totalProg)}</div></div>
    <div class="mc"><div style="font-size:28px;margin-bottom:8px">🎯</div><div class="ml">OKRs de Área${af?' ('+af+')':''}</div><div class="mv">${aokrsFiltrados.length}</div></div>
    <div class="mc"><div style="font-size:28px;margin-bottom:8px">🏢</div><div class="ml">OKRs Companhia</div><div class="mv">${_cokrs.length}</div></div>
    <div class="mc"><div style="font-size:28px;margin-bottom:8px">✅</div><div class="ml">Aprovações Pendentes</div><div class="mv" style="color:var(--warning)" id="pend-count">—</div>
      <div style="margin-top:6px"><button class="btn bg bsm" onclick="go('approvals')">Ver →</button></div>
    </div>
  </div>

async function pRank(){
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">🏆 Ranking de Desempenho</div><div class="ps">Comparativo por área</div></div></div>
  <div class="cnt">
    <div class="fb"><span class="fl">📅 Mês:</span>
      <select class="fs" id="rm" onchange="lRank()">${mesOpts(new Date().getMonth()+1)}</select>
      <select class="fs" id="ra" onchange="lRank()">${anoOpts()}</select>
    </div>
    <div id="rc">${ld()}</div>
  </div>`;
  await loadAll();
  lRank();
}

function lRank(){
  const mes=parseInt(document.getElementById('rm')?.value)||new Date().getMonth()+1;
  const ano=parseInt(document.getElementById('ra')?.value)||new Date().getFullYear();
  const areas=[...new Set(_aokrs.map(o=>o.area).filter(Boolean))];
  const dados=areas.map(area=>{
    const list=_aokrs.filter(o=>o.area===area);
    // Pega snapshot do mês ou usa progresso atual
    const pcts=list.map(ao=>{
      const snap=snapAteMes('okr_area',ao.id,mes,ano);
      return snap?parseInt(snap.pct)||0:parseInt(ao.progresso)||0;
    });
    const pct=pcts.length?Math.round(pcts.reduce((s,p)=>s+p,0)/pcts.length):0;
    const resp=list[0]?.responsavel||area;
    // Busca usuário pelo nome para pegar foto
    const user=_users.find(u=>u.nome===resp);
    return{area,pct,resp,foto:user?.foto||''};
  }).sort((a,b)=>b.pct-a.pct);

  const el=document.getElementById('rc');if(!el)return;
  if(!dados.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-mid)">Nenhum dado de área disponível.</div>';return}
  const tr=['🥇','🥈','🥉'];
  const top3=dados.slice(0,3);
  const po=[top3[1],top3[0],top3[2]].filter(Boolean);
  const sh=[58,80,42];const sc=['var(--blue)','var(--orange)','#6b7280'];const ri=[1,0,2];
  el.innerHTML=`<div class="card"><div class="ch"><div class="ct">🏆 Pódio — ${MOS[mes-1]}/${ano}</div></div><div class="cb">
    <div class="podium-wrap">
      ${po.map((u,i)=>`<div style="display:flex;flex-direction:column;align-items:center;width:120px">
        <div style="font-size:20px;text-align:center;margin-bottom:4px">${tr[ri[i]]}</div>
        ${av(u.resp,54,u.foto)}
        <div style="font-size:12px;font-weight:700;text-align:center;margin-top:5px">${u.area}</div>
        <div style="font-size:11px;color:var(--gray-mid);text-align:center">${u.resp}</div>
        <div style="font-size:18px;font-weight:800;text-align:center;color:${ri[i]===0?'var(--orange)':ri[i]===1?'var(--blue)':'var(--gray-mid)'};margin:4px 0 8px">${u.pct}%</div>
        <div style="border-radius:8px 8px 0 0;width:100%;height:${sh[i]}px;background:${sc[i]};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:rgba(255,255,255,.8)">${ri[i]+1}º</div>
      </div>`).join('')}
    </div>
    <div style="height:1px;background:var(--border);margin:4px 0 16px"></div>
    ${dados.map((u,i)=>`<div class="rrow">
      <div style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:${i===0?'var(--orange)':i===1?'var(--blue)':i===2?'#6b7280':'var(--gray-lighter)'};color:${i<3?'#fff':'var(--gray-mid)'};flex-shrink:0">${i+1}</div>
      ${av(u.resp,36,u.foto)}
      <div style="flex:1"><div style="font-size:13px;font-weight:700">${u.area}</div><div style="font-size:11px;color:var(--gray-mid)">${u.resp}</div></div>
      <div style="min-width:150px">${pb(u.pct)}</div>
      <div style="font-size:14px;font-weight:800;min-width:42px;text-align:right;color:${u.pct>=60?'var(--success)':u.pct>=40?'var(--warning)':'var(--danger)'}">${u.pct}%</div>
      ${i<3?`<div style="font-size:18px">${tr[i]}</div>`:'<div style="width:20px"></div>'}
    </div>`).join('')}
  </div></div>`;
}

        <div class="fg"><label class="flb">Valor em ${mesLabel}</label><input class="fi" type="number" id="kc-${k.id}" value="${k.atual||0}"/></div>
        <div class="fg"><label class="flb">Meta</label><input class="fi" type="number" id="km-${k.id}" value="${k.meta||0}"/></div>
        <div class="fg"><label class="flb">Saúde em ${mesLabel}</label>
          <select class="fsl" id="ks-${k.id}"><option value="green"${k.saude==='green'?' selected':''}>✅ No prazo</option><option value="yellow"${k.saude==='yellow'?' selected':''}>⚠️ Atenção</option><option value="red"${k.saude==='red'?' selected':''}>🔴 Em risco</option></select>
        </div>
      </div>
      <div class="fg"><label class="flb">Comentário</label><input class="fi" id="kcom-${k.id}" placeholder="Observações do mês..."/></div>
    </div>
  </div>`).join(''):'<div style="background:var(--gray-lighter);border-radius:8px;padding:16px;text-align:center;color:var(--gray-mid);margin-bottom:16px">Nenhum KR KPI para esta seleção.</div>'}

  <div style="font-size:13px;font-weight:700;margin:16px 0 12px;color:var(--gray-dark)">🎯 Iniciativas — ${mesLabel}</div>
  ${ai.length?ai.map(i=>`<div class="card" style="margin-bottom:10px">
    <div class="ch"><div><div class="ct">${i.nome}</div><div style="font-size:11px;color:var(--gray-mid)">Prazo: ${i.data_fim||'—'} · Status atual: ${i.status||'Não iniciada'}</div></div>${bdg(i.status||'Não iniciada')}</div>
    <div class="cb">
      <div class="fr">
        <div class="fg"><label class="flb">Status em ${mesLabel}</label>
          <select class="fsl" id="is-${i.id}">${STATUS_INIT.map(s=>`<option${i.status===s?' selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="fg"><label class="flb">Comentário</label><input class="fi" id="ic-${i.id}" value="${esc(i.comentario||'')}" placeholder="O que aconteceu em ${mesLabel}?"/></div>
      </div>
    </div>
  </div>`).join(''):'<div style="background:var(--gray-lighter);border-radius:8px;padding:16px;text-align:center;color:var(--gray-mid)">Nenhuma iniciativa para esta seleção.</div>'}

  ${(kpis.length||ai.length)?`<div style="margin-top:20px;padding-top:16px;border-top:2px solid var(--border);display:flex;justify-content:flex-end">
    <button class="btn bp" style="font-size:14px;padding:10px 24px" onclick="gravarTodosSnapshots(${JSON.stringify(kpis).replace(/"/g,'&quot;')},${JSON.stringify(ai).replace(/"/g,'&quot;')},${mes},${ano})">
      💾 Gravar todos os snapshots de ${mesLabel}
    </button>
  </div>`:''}`;
}

async function gravarTodosSnapshots(kpis,inits,mes,ano){
  const btn=event.target;btn.disabled=true;btn.textContent='Gravando...';
  const mesLabel=`${MOS[mes-1]}/${ano}`;
  let ok=0,erros=0;

  // Grava KPIs
  for(const k of kpis){
    const atual=parseFloat(document.getElementById(`kc-${k.id}`)?.value)||0;
    const meta=parseFloat(document.getElementById(`km-${k.id}`)?.value)||1;
    const saude=document.getElementById(`ks-${k.id}`)?.value||'green';
    const com=document.getElementById(`kcom-${k.id}`)?.value||'';
    const prog=k.indicador==='crescente'?Math.min(Math.round((atual/meta)*100),100):Math.max(Math.round((1-atual/meta)*100),0);
    const r=await apiSnap({tipo:'kr',item_id:k.id,mes,ano,valor_atual:atual,meta,saude,pct:prog,comentario:com,status:''});
    r.ok?ok++:erros++;
  }

  // Grava iniciativas
  for(const i of inits){
    const st=document.getElementById(`is-${i.id}`)?.value||i.status;
    const com=document.getElementById(`ic-${i.id}`)?.value||'';
    const pctMap={'Concluída':100,'Concluída com atraso':100,'Em andamento':50,'Não iniciada':0,'Pausada':0,'Cancelada':0};
    const r=await apiSnap({tipo:'iniciativa',item_id:i.id,mes,ano,status:st,pct:pctMap[st]||0,comentario:com,valor_atual:'',meta:'',saude:'green'});
    r.ok?ok++:erros++;
  }

  if(erros===0){
    toast(`✅ ${ok} snapshots gravados para ${mesLabel}!`);
  }else{
    toast(`⚠️ ${ok} gravados, ${erros} com erro.`,'err');
  }
  btn.disabled=false;btn.textContent=`💾 Gravar todos os snapshots de ${mesLabel}`;
}

// ══════════════════════════════════════
// APROVAÇÕES
// ══════════════════════════════════════
async function pApprov(){
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">Aprovações</div><div class="ps">Fluxo de aprovação de OKRs e KRs</div></div></div>
  <div class="cnt">
    <div class="tabs"><div class="tab active" onclick="lApprov('Pendente',this)">Pendentes</div><div class="tab" onclick="lApprov('Aprovado',this)">Aprovados</div><div class="tab" onclick="lApprov('Reprovado',this)">Reprovados</div></div>
    <div id="al">${ld()}</div>
  </div>`;
  await lApprov('Pendente',null);
}
async function lApprov(f,el){
  if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
  const all=await apiG('aprovacoes');
  const items=all.filter(a=>a.status===f);
  document.getElementById('bc').textContent=all.filter(a=>a.status==='Pendente').length;
  const cont=document.getElementById('al');if(!cont)return;
  if(!items.length){cont.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-mid)">✅ Nenhum item nesta categoria</div>';return}
  cont.innerHTML=items.map(a=>`<div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px">
    <div style="width:38px;height:38px;border-radius:9px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">${a.tipo?.includes('Key')?'📊':'🏬'}</div>
    <div style="flex:1;min-width:0"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><div style="font-size:13px;font-weight:700;margin-bottom:3px">${a.nome}</div>
        <div style="font-size:11px;color:var(--gray-mid)">${a.tipo} · ${a.area} · por <strong>${a.solicitante}</strong> em ${a.data}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${bdg(a.status)}
        ${a.status==='Pendente'?`<button class="btn bsc bsm" onclick='dApprov("${a.id}","Aprovado",${JSON.stringify(a).replace(/"/g,"&quot;")})'>✓ Aprovar</button><button class="btn bsd bsm" onclick='dApprov("${a.id}","Reprovado",${JSON.stringify(a).replace(/"/g,"&quot;")})'>✕ Reprovar</button>`:''}
      </div>
    </div></div>
  </div>`).join('');
}
async function dApprov(id,dec,a){
  const r=await apiU('aprovacoes',{...a,id,status:dec,aprovado_por:'Admin'});
  if(r.ok){toast(`${dec}! ✅`);pApprov();}else toast('Erro: '+(r.erro||''),'err');
}

// Init
loadAll().then(()=>go('dashboard'));
</script>
