<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKR Suite Piacentini</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1f2e;min-height:100vh;display:flex}
:root{--orange:#e8621a;--orange-light:#fff3ec;--orange-border:#fcd7bc;--blue:#1a4fa0;--blue-light:#e8f0fb;--gray-dark:#2d3142;--gray-mid:#6b7280;--gray-lighter:#f7f8fa;--white:#fff;--border:#e2e5eb;--border2:#d1d5de;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--nav-w:230px}
nav{width:var(--nav-w);min-height:100vh;background:var(--gray-dark);display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100;overflow-y:auto}
.nl{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;flex-shrink:0}
.ni{width:32px;height:32px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
.nt{font-weight:700;font-size:14px;color:#fff}.ns{font-size:10px;color:rgba(255,255,255,.4)}
.sec{padding:12px 14px 3px;font-size:9px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,.3);text-transform:uppercase}
.nm{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;border-radius:7px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.6);transition:all .15s}
.nm:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.nm.active{background:var(--orange);color:#fff}
.nicon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--orange);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px}
.nm.active .nbadge{background:rgba(255,255,255,.3)}
.nb{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.nu{display:flex;align-items:center;gap:9px;cursor:pointer;padding:7px 9px;border-radius:7px}
.nu:hover{background:rgba(255,255,255,.07)}
.nav-av{width:32px;height:32px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex-shrink:0;overflow:hidden}
.nav-av img{width:100%;height:100%;object-fit:cover}
.nav-un{font-size:11px;font-weight:600;color:#fff}
.nav-ur{font-size:9px;color:rgba(255,255,255,.4)}
main{margin-left:var(--nav-w);flex:1;background:#f0f2f5;min-height:100vh}
.ph{padding:22px 26px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.pt{font-size:19px;font-weight:700;color:var(--gray-dark)}
.ps{font-size:12px;color:var(--gray-mid);margin-top:2px}
.cnt{padding:18px 26px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.bp{background:var(--orange);color:#fff}.bp:hover{background:#d0561a}
.bg{background:var(--white);color:var(--gray-mid);border:1px solid var(--border2)}.bg:hover{background:var(--gray-lighter)}
.bsm{padding:4px 10px;font-size:11px}
.bsc{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.bsd{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.blg{background:var(--blue);color:#fff}.blg:hover{background:#163d7e}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px}
.ch{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ct{font-size:13px;font-weight:700;color:var(--gray-dark)}
.cb{padding:16px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.ml{font-size:10px;color:var(--gray-mid);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.mv{font-size:24px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--gray-dark)}
.fb{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.fl{font-size:11px;font-weight:600;color:var(--gray-mid);white-space:nowrap}
.fs{background:var(--gray-lighter);border:1px solid var(--border2);border-radius:7px;padding:5px 9px;font-size:12px;color:var(--gray-dark);cursor:pointer;font-family:inherit}
.fd{width:1px;height:18px;background:var(--border2)}
.pb{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .5s}
.pg{background:var(--success)}.po{background:var(--orange)}.pr{background:var(--danger)}.pbl{background:var(--blue)}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.bg2{background:#dcfce7;color:#166534}.by{background:#fef9c3;color:#854d0e}
.br2{background:#fef2f2;color:#991b1b}.bb{background:var(--blue-light);color:var(--blue)}
.bor{background:var(--orange-light);color:#92400e}.bgr{background:#f3f4f6;color:#374151}
.bpu{background:#f5f3ff;color:#6d28d9}
.bdot{width:4px;height:4px;border-radius:50%;background:currentColor}
.hd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 12px;text-align:left;font-size:9px;font-weight:700;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--gray-lighter)}
td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--gray-dark);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.tabs{display:flex;background:#edf0f5;border-radius:8px;padding:3px;margin-bottom:16px;width:fit-content}
.tab{padding:5px 12px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;color:var(--gray-mid);transition:all .15s;white-space:nowrap}
.tab.active{background:var(--white);color:var(--orange);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fg{margin-bottom:12px}
.flb{font-size:11px;font-weight:600;color:var(--gray-dark);margin-bottom:4px;display:block}
.fi,.fsl,.fta{width:100%;background:var(--white);border:1px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--gray-dark);outline:none;transition:border .15s;font-family:inherit}
.fi:focus,.fsl:focus,.fta:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,98,26,.1)}
.fta{resize:vertical;min-height:64px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ua{border:2px dashed var(--border2);border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:var(--gray-lighter)}
.ua:hover{border-color:var(--orange);background:var(--orange-light)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:36px;overflow-y:auto}
.md{background:var(--white);border-radius:14px;width:580px;max-width:95vw;border:1px solid var(--border);margin-bottom:36px}
.mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:14px;font-weight:700;color:var(--gray-dark)}
.mbd{padding:20px;max-height:62vh;overflow-y:auto}
.mf{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.mc2{width:26px;height:26px;border-radius:6px;background:var(--gray-lighter);border:none;cursor:pointer;color:var(--gray-mid);font-size:16px;display:flex;align-items:center;justify-content:center}
.oi{background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.oh{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s;border-radius:10px}
.oh:hover{background:var(--gray-lighter)}
.on{font-size:12px;font-weight:700;color:var(--gray-dark);margin-bottom:2px}
.om{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--gray-mid);flex-wrap:wrap}
.chv{font-size:11px;color:var(--gray-mid);transition:transform .2s;flex-shrink:0}
.chv.open{transform:rotate(90deg)}
.oc{padding:0 12px 12px;display:none}
.oc.open{display:block}
.kr-row{background:var(--gray-lighter);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.ld{display:flex;align-items:center;justify-content:center;padding:36px;color:var(--gray-mid);font-size:13px;gap:10px}
.sp{width:18px;height:18px;border:2px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;right:20px;background:var(--gray-dark);color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;font-weight:500;z-index:9999;opacity:0;transform:translateY(8px);transition:all .3s}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
.uc{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.uc:hover{border-color:var(--orange);background:var(--orange-light)}
.ac{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.ac:hover{border-color:var(--orange);background:var(--orange-light)}
.pw{font-size:10px;font-weight:700;color:var(--blue);background:var(--blue-light);padding:2px 6px;border-radius:4px;white-space:nowrap}
.alert-card{background:#fef9c3;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.alert-icon{font-size:16px;flex-shrink:0;margin-top:1px}
/* Árvore */
.tree-node{margin-left:0}
.tree-child{margin-left:24px;border-left:2px solid var(--border2);padding-left:12px;margin-top:4px}
.tree-item{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .15s}
.tree-item:hover{background:var(--gray-lighter)}
.tree-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
/* Chart */
.chart-wrap{position:relative;overflow-x:auto}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#d1d5de;border-radius:3px}
</style>
</head>
<body>
<nav>
  <div class="nl"><div class="ni">O</div><div><div class="nt">OKR Suite</div><div class="ns">Piacentini</div></div></div>
  <div class="sec">Principal</div>
  <div class="nm active" onclick="go('dashboard')"><span class="nicon">⊞</span> Dashboard</div>
  <div class="nm" onclick="go('evolucao')"><span class="nicon">📈</span> Evolução Histórica</div>
  <div class="nm" onclick="go('arvore')"><span class="nicon">🌳</span> Árvore OKR</div>
  <div class="nm" onclick="go('ranking')"><span class="nicon">🏆</span> Ranking</div>
  <div class="sec">Cadastros</div>
  <div class="nm" onclick="go('areas')"><span class="nicon">🏬</span> Áreas</div>
  <div class="nm" onclick="go('usuarios')"><span class="nicon">👥</span> Usuários</div>
  <div class="sec">OKRs</div>
  <div class="nm" onclick="go('company-okrs')"><span class="nicon">🏢</span> OKR Companhia</div>
  <div class="nm" onclick="go('area-okrs')"><span class="nicon">📋</span> OKR por Área</div>
  <div class="nm" onclick="go('key-results')"><span class="nicon">📊</span> Key Results</div>
  <div class="nm" onclick="go('initiatives')"><span class="nicon">✅</span> Iniciativas</div>
  <div class="sec">Manutenção</div>
  <div class="nm" onclick="go('manutencao')"><span class="nicon">🔄</span> Atualizar Status</div>
  <div class="sec">Admin</div>
  <div class="nm" onclick="go('approvals')"><span class="nicon">✔</span> Aprovações <span class="nbadge" id="bc">0</span></div>
  <div class="nb">
    <div class="nu" onclick="go('usuarios')">
      <div class="nav-av" id="nav-av">A</div>
      <div><div class="nav-un" id="nav-nm">Admin</div><div class="nav-ur" id="nav-rl">Administrador</div></div>
    </div>
  </div>
</nav>
<main id="main"></main>
<div id="mr"></div>
<div class="toast" id="toast"></div>
<script>
const GAS='https://script.google.com/macros/s/AKfycbwnAdAcSaTnD6BxKYBxgsRwZqRbi1oSZsEZ00qe7m7cD4mpe8NYhojDiLt3F3dNOq8_wQ/exec';
const MOS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const STATUS_INIT=['Não iniciada','Em andamento','Concluída','Cancelada','Pausada','Concluída com atraso'];
const CORS=['#e8621a','#1a4fa0','#16a34a','#7c3aed','#0891b2','#dc2626','#d97706','#0d9488'];
const PCT_STATUS={'Concluída':100,'Concluída com atraso':100,'Em andamento':50,'Não iniciada':0,'Cancelada':0,'Pausada':0};

// Cache global
let DB={users:[],areas:[],aokrs:[],cokrs:[],krs:[],inits:[],snaps:[]};

function toast(msg,t='ok'){const e=document.getElementById('toast');e.textContent=msg;e.className=`toast show ${t}`;setTimeout(()=>e.className='toast',3500)}

function enc(obj){try{return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}catch(e){return btoa(JSON.stringify(obj))}}

async function apiG(aba){try{const r=await fetch(`${GAS}?acao=listar&aba=${aba}`);return(await r.json()).dados||[]}catch(e){return[]}}
async function apiP(aba,body){try{const r=await fetch(`${GAS}?acao=criar&aba=${aba}&body=${enc(body)}&enc=b64`);return await r.json()}catch(e){return{ok:false,erro:e.message}}}
async function apiU(aba,body){try{const r=await fetch(`${GAS}?acao=atualizar&aba=${aba}&body=${enc(body)}&enc=b64`);return await r.json()}catch(e){return{ok:false,erro:e.message}}}
async function apiSnap(body){try{const r=await fetch(`${GAS}?acao=snapshot&aba=snapshots&body=${enc(body)}&enc=b64`);return await r.json()}catch(e){return{ok:false,erro:e.message}}}

async function loadAll(){
  const res=await Promise.all([apiG('usuarios'),apiG('areas'),apiG('okr_area'),apiG('okr_companhia'),apiG('key_results'),apiG('iniciativas'),apiG('snapshots')]);
  DB={users:res[0],areas:res[1],aokrs:res[2],cokrs:res[3],krs:res[4],inits:res[5],snaps:res[6]};
}

// ─── CÁLCULO DE PROGRESSO ───────────────────────────────────────
function calcKPI(k,snapKR){
  // Usa valor do snapshot se disponível, senão usa cadastro
  const atual=parseFloat(snapKR?.valor_atual||k.atual)||0;
  const meta=parseFloat(k.meta)||1;
  if(k.indicador==='decrescente'){return Math.min(Math.round((meta/atual)*100),100)}
  return Math.min(Math.round((atual/meta)*100),100);
}

function calcKR(k,mes,ano){
  if(k.tipo==='KPI'){
    const snap=snapAteMes('kr',k.id,mes,ano);
    return calcKPI(k,snap);
  }
  // Projeto: média das iniciativas
  const mine=DB.inits.filter(i=>i.kr_id==k.id&&i.status!=='Cancelada');
  if(!mine.length)return 0;
  const pcts=mine.map(i=>{
    const snap=snapAteMes('iniciativa',i.id,mes,ano);
    return snap?parseInt(snap.pct)||0:PCT_STATUS[i.status]||0;
  });
  return Math.round(pcts.reduce((s,p)=>s+p,0)/pcts.length);
}

function calcAOKR(ao,mes,ano){
  const krs=DB.krs.filter(k=>k.okr_area_id==ao.id);
  if(!krs.length)return 0;
  const pcts=krs.map(k=>calcKR(k,mes,ano));
  return Math.round(pcts.reduce((s,p)=>s+p,0)/pcts.length);
}

function calcCOKR(co,mes,ano){
  const areas=[...new Set(DB.aokrs.filter(ao=>ao.okr_companhia_id==co.id).map(ao=>ao.area).filter(Boolean))];
  if(!areas.length)return 0;
  const pcts=areas.map(area=>{
    const aokrsDaArea=DB.aokrs.filter(ao=>ao.okr_companhia_id==co.id&&ao.area===area);
    if(!aokrsDaArea.length)return 0;
    const p=aokrsDaArea.map(ao=>calcAOKR(ao,mes,ano));
    return Math.round(p.reduce((s,x)=>s+x,0)/p.length);
  });
  return Math.round(pcts.reduce((s,p)=>s+p,0)/pcts.length);
}

function snapAteMes(tipo,item_id,mes,ano){
  const rel=DB.snaps.filter(s=>s.tipo===tipo&&s.item_id==item_id&&(parseInt(s.ano)<parseInt(ano)||(parseInt(s.ano)===parseInt(ano)&&parseInt(s.mes)<=parseInt(mes))));
  if(!rel.length)return null;
  return rel.sort((a,b)=>(parseInt(b.ano)*12+parseInt(b.mes))-(parseInt(a.ano)*12+parseInt(a.mes)))[0];
}

// ─── HELPERS ────────────────────────────────────────────────────
function hc(p){p=parseInt(p)||0;return p>=60?'pg':p>=40?'po':'pr'}
function pb(p){p=parseInt(p)||0;return`<div class="pb"><div class="pf ${hc(p)}" style="width:${Math.min(p,100)}%"></div></div>`}
function pbl(p){p=parseInt(p)||0;return`<div class="pb"><div class="pf pbl" style="width:${Math.min(p,100)}%"></div></div>`}
function bdg(t){const m={'Publicado':'bg2','Pendente':'by','Em andamento':'bb','Concluída':'bg2','Não iniciada':'bgr','Cancelada':'br2','Aprovado':'bg2','Reprovado':'br2','Concluída com atraso':'by','Pausada':'bpu','ADM':'bor','CEO':'bb','GESTOR':'bg2'};return`<span class="bdg ${m[t]||'bgr'}">${t}</span>`}
function hbdg(h){const m={green:'bg2',yellow:'by',red:'br2'};const l={green:'No prazo',yellow:'Atenção',red:'Em risco'};return`<span class="bdg ${m[h]||'bgr'}"><span class="bdot"></span>${l[h]||h}</span>`}
function ld(){return`<div class="ld"><div class="sp"></div> Carregando...</div>`}
function ini(n){return(n||'?').split(' ').map(x=>x[0]||'').slice(0,2).join('').toUpperCase()||'?'}
function corN(n){let h=0;for(let c of(n||''))h=(h*31+c.charCodeAt(0))%CORS.length;return CORS[h]}
function av(n,s=34,foto=''){if(foto&&foto.startsWith('data:'))return`<div style="width:${s}px;height:${s}px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${foto}" style="width:100%;height:100%;object-fit:cover"></div>`;return`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${corN(n)};display:flex;align-items:center;justify-content:center;font-size:${Math.round(s*.3)}px;font-weight:800;color:#fff;flex-shrink:0">${ini(n)}</div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;')}
function mesOpts(sel){return MOS.map((m,i)=>`<option value="${i+1}"${parseInt(sel)===i+1?' selected':''}>${m}</option>`).join('')}
function anoOpts(){const y=new Date().getFullYear();return[y-1,y,y+1].map(a=>`<option value="${a}"${a===y?' selected':''}>${a}</option>`).join('')}
function userOpts(selNome){return`<option value="">— Selecione —</option>`+DB.users.map(u=>`<option value="${esc(u.nome)}"${u.nome===selNome?' selected':''}>${u.nome}${u.area?' ('+u.area+')':''}</option>`).join('')}
function areaOpts(sel,placeholder='Todas as Áreas'){return`<option value="">${placeholder}</option>`+DB.areas.filter(a=>a.ativo!=='não').map(a=>`<option value="${esc(a.nome)}"${a.nome===sel?' selected':''}>${a.nome}</option>`).join('')}
function peso(total){return total>0?Math.round(10000/total)/100:0}

function go(p){
  document.querySelectorAll('.nm').forEach(n=>n.classList.remove('active'));
  const idx={dashboard:0,evolucao:1,arvore:2,ranking:3,areas:5,usuarios:6,'company-okrs':8,'area-okrs':9,'key-results':10,initiatives:11,manutencao:13,approvals:15};
  const items=document.querySelectorAll('.nm');
  if(items[idx[p]])items[idx[p]].classList.add('active');
  ({dashboard:pDash,evolucao:pEvolucao,arvore:pArvore,ranking:pRank,areas:pAreas,usuarios:pUsers,'company-okrs':pCOkr,'area-okrs':pAOkr,'key-results':pKR,initiatives:pInit,manutencao:pMaint,approvals:pApprov})[p]?.()
}
function openM(h){document.getElementById('mr').innerHTML=`<div class="mo" onclick="if(event.target===this)closeM()">${h}</div>`}
function closeM(){document.getElementById('mr').innerHTML=''}

// ════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════
async function pDash(){
  const now=new Date();
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">Dashboard Executivo</div><div class="ps">Acompanhamento estratégico com cálculo automático em cascata</div></div>
    <button class="btn blg bsm" onclick="exportPDF()">⬇ Exportar PDF</button>
  </div>
  <div class="cnt">
    <div class="fb">
      <span class="fl">🔍 Área:</span>
      <select class="fs" id="fa" onchange="lDash()">${''}</select>
      <div class="fd"></div>
      <span class="fl">📅 Mês:</span>
      <select class="fs" id="fmes" onchange="lDash()">${mesOpts(now.getMonth()+1)}</select>
      <select class="fs" id="fano" onchange="lDash()">${anoOpts()}</select>
    </div>
    <div id="dc">${ld()}</div>
  </div>`;
  await loadAll();
  document.getElementById('fa').innerHTML=areaOpts('');
  lDash();
}

function lDash(){
  const af=document.getElementById('fa')?.value||'';
  const mes=parseInt(document.getElementById('fmes')?.value)||new Date().getMonth()+1;
  const ano=parseInt(document.getElementById('fano')?.value)||new Date().getFullYear();
  const mesLabel=`${MOS[mes-1]}/${ano}`;
  const el=document.getElementById('dc');if(!el)return;

  // Cálculo em cascata
  const aokrsFiltrados=af?DB.aokrs.filter(o=>o.area===af):DB.aokrs;
  const totalProg=aokrsFiltrados.length?Math.round(aokrsFiltrados.map(ao=>calcAOKR(ao,mes,ano)).reduce((s,p)=>s+p,0)/aokrsFiltrados.length):0;

  // OKRs Companhia com cobertura da área
  const cokrsComPct=DB.cokrs.map(co=>{
    const todasAreas=[...new Set(DB.aokrs.filter(ao=>ao.okr_companhia_id==co.id).map(ao=>ao.area).filter(Boolean))];
    const areasFiltr=af?todasAreas.filter(a=>a===af):todasAreas;
    const pct=todasAreas.length>0?Math.round((areasFiltr.length/todasAreas.length)*100):0;
    const progCo=calcCOKR(co,mes,ano);
    return{...co,_pctCobertura:pct,_totalAreas:todasAreas.length,_areasFiltr:areasFiltr.length,_prog:progCo};
  });

  // OKRs Área com progresso calculado
  const aokrsComProg=aokrsFiltrados.map(ao=>({...ao,_prog:calcAOKR(ao,mes,ano)}));

  // ALERTAS
  const hoje=new Date(ano,mes-1,28); // último dia do mês de referência
  const alertasInit=DB.inits.filter(i=>{
    if(!i.data_fim)return false;
    const df=new Date(i.data_fim);
    const venceNoMes=df.getMonth()===mes-1&&df.getFullYear()===ano;
    if(!venceNoMes)return false;
    const snap=snapAteMes('iniciativa',i.id,mes,ano);
    const st=snap?snap.status:i.status;
    return st!=='Concluída'&&st!=='Concluída com atraso';
  });
  const alertasKR=DB.krs.filter(k=>{
    if(!k.data_fim)return false;
    const df=new Date(k.data_fim);
    const venceNoMes=df.getMonth()===mes-1&&df.getFullYear()===ano;
    if(!venceNoMes)return false;
    const prog=calcKR(k,mes,ano);
    return prog<100;
  });

  apiG('aprovacoes').then(ap=>{
    const pend=ap.filter(a=>a.status==='Pendente').length;
    document.getElementById('bc').textContent=pend;
    const e2=document.getElementById('pend-count');if(e2)e2.textContent=pend;
  });

  el.innerHTML=`
  <div class="mg">
    <div class="mc"><div style="font-size:24px;margin-bottom:7px">📊</div><div class="ml">Progresso — ${mesLabel}</div><div class="mv" style="color:var(--orange)">${totalProg}%</div><div style="margin-top:7px">${pb(totalProg)}</div></div>
    <div class="mc"><div style="font-size:24px;margin-bottom:7px">🎯</div><div class="ml">OKRs de Área${af?' ('+af+')':''}</div><div class="mv">${aokrsFiltrados.length}</div></div>
    <div class="mc"><div style="font-size:24px;margin-bottom:7px">⚠️</div><div class="ml">Alertas — ${mesLabel}</div><div class="mv" style="color:var(--danger)">${alertasInit.length+alertasKR.length}</div></div>
    <div class="mc"><div style="font-size:24px;margin-bottom:7px">🕐</div><div class="ml">Aprovações Pendentes</div><div class="mv" style="color:var(--warning)" id="pend-count">—</div>
      <div style="margin-top:5px"><button class="btn bg bsm" onclick="go('approvals')">Ver →</button></div>
    </div>
  </div>

  <!-- ALERTAS -->
  ${(alertasInit.length||alertasKR.length)?`
  <div class="card" style="margin-bottom:16px;border-color:#fde68a">
    <div class="ch" style="background:#fefce8"><div class="ct">⚠️ Alertas — ${mesLabel}</div></div>
    <div class="cb">
      ${alertasKR.map(k=>`<div class="alert-card"><div class="alert-icon">📊</div><div><div style="font-size:12px;font-weight:700">KR vencendo em ${mesLabel} sem 100%</div><div style="font-size:11px;color:var(--gray-mid);margin-top:2px">${k.nome} · Progresso: ${calcKR(k,mes,ano)}%</div></div></div>`).join('')}
      ${alertasInit.map(i=>{const snap=snapAteMes('iniciativa',i.id,mes,ano);const st=snap?snap.status:i.status;return`<div class="alert-card"><div class="alert-icon">✅</div><div><div style="font-size:12px;font-weight:700">Iniciativa vencendo em ${mesLabel} sem conclusão</div><div style="font-size:11px;color:var(--gray-mid);margin-top:2px">${i.nome} · Status: ${st||'Não iniciada'} · Prazo: ${i.data_fim}</div></div></div>`}).join('')}
    </div>
  </div>`:''}

  <!-- OKRs Companhia com cobertura -->
  <div class="card" style="margin-bottom:16px">
    <div class="ch"><div class="ct">🏢 OKRs da Companhia — cobertura ${af?'área '+af:'por área'} e progresso ${mesLabel}</div></div>
    <div class="cb">
      ${cokrsComPct.map(co=>`<div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;gap:12px">
          <div style="font-size:12px;font-weight:700;flex:1">${co.nome}</div>
          <div style="font-size:10px;color:var(--gray-mid);white-space:nowrap">${co._areasFiltr}/${co._totalAreas} áreas vinculadas</div>
          <div style="font-size:12px;font-weight:800;color:var(--blue);min-width:36px;text-align:right">${co._pctCobertura}%</div>
          <div style="font-size:12px;font-weight:800;color:${co._prog>=60?'var(--success)':co._prog>=40?'var(--warning)':'var(--danger)'};min-width:36px;text-align:right">${co._prog}%</div>
        </div>
        <div style="display:flex;gap:6px">
          <div style="flex:1">${pbl(co._pctCobertura)}</div>
          <div style="flex:1">${pb(co._prog)}</div>
        </div>
        <div style="display:flex;gap:6px;margin-top:2px">
          <div style="flex:1;font-size:9px;color:var(--blue)">cobertura de áreas</div>
          <div style="flex:1;font-size:9px;color:var(--gray-mid)">progresso ${mesLabel}</div>
        </div>
      </div>`).join('')||'<div style="text-align:center;padding:20px;color:var(--gray-mid)">Nenhum OKR da companhia cadastrado</div>'}
    </div>
  </div>

  <!-- OKRs Área -->
  <div class="card">
    <div class="ch"><div class="ct">📋 OKRs por Área — progresso em ${mesLabel}</div></div>
    <div class="cb" style="padding:0">
      ${aokrsComProg.length?`<table>
        <thead><tr><th>OKR Área</th><th>Área</th><th>Responsável</th><th>Progresso ${mesLabel}</th><th>Saúde</th></tr></thead>
        <tbody>${aokrsComProg.map(o=>`<tr>
          <td style="font-weight:600">${o.nome}</td>
          <td style="font-size:11px;color:var(--gray-mid)">${o.area}</td>
          <td style="font-size:11px;color:var(--gray-mid)">${o.responsavel||'—'}</td>
          <td style="min-width:140px">${pb(o._prog)}<div style="text-align:right;font-size:10px;font-weight:700;margin-top:2px">${o._prog}%</div></td>
          <td>${hbdg(o.saude||'green')}</td>
        </tr>`).join('')}</tbody>
      </table>`:'<div style="text-align:center;padding:28px;color:var(--gray-mid)">Nenhum OKR de área'+(af?' para '+af:'')+' cadastrado</div>'}
    </div>
  </div>`;
}

// EVOLUÇÃO HISTÓRICA
// ════════════════════════════════════════
async function pEvolucao(){
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">📈 Evolução Histórica</div><div class="ps">Progresso mês a mês — CIA e por área</div></div></div>
  <div class="cnt">
    <div class="fb">
      <span class="fl">🔍 Área:</span>
      <select class="fs" id="ev-area" onchange="lEvolucao()">${''}</select>
      <div class="fd"></div>
      <span class="fl">📅 Ano:</span>
      <select class="fs" id="ev-ano" onchange="lEvolucao()">${anoOpts()}</select>
    </div>
    <div id="ev-content">${ld()}</div>
  </div>`;
  await loadAll();
  document.getElementById('ev-area').innerHTML=areaOpts('');
  lEvolucao();
}

function lEvolucao(){
  const af=document.getElementById('ev-area')?.value||'';
  const ano=parseInt(document.getElementById('ev-ano')?.value)||new Date().getFullYear();
  const el=document.getElementById('ev-content');if(!el)return;

  const mesesDoAno=MOS.map((m,i)=>({label:m,mes:i+1}));

  // Para cada mês calcula o progresso
  const dadosCIA=mesesDoAno.map(({mes})=>{
    const pcts=DB.cokrs.map(co=>calcCOKR(co,mes,ano));
    return pcts.length?Math.round(pcts.reduce((s,p)=>s+p,0)/pcts.length):null;
  });

  // Por área filtrada (ou todas)
  const areaLabel=af||'Todas as Áreas';
  const dadosArea=mesesDoAno.map(({mes})=>{
    const aokrs=af?DB.aokrs.filter(o=>o.area===af):DB.aokrs;
    if(!aokrs.length)return null;
    const pcts=aokrs.map(ao=>calcAOKR(ao,mes,ano));
    return Math.round(pcts.reduce((s,p)=>s+p,0)/pcts.length);
  });

  // Verifica se tem dados
  const temDados=dadosCIA.some(v=>v!==null)||dadosArea.some(v=>v!==null);
  if(!temDados){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-mid)">Nenhum dado encontrado. Alimente os snapshots mensais em Atualizar Status.</div>';return}

  // SVG gráfico
  const W=Math.max(600,document.getElementById('ev-content')?.offsetWidth||700);
  const H=260;const pt={t:20,r:20,b:40,l:44};
  const cw=W-pt.l-pt.r,ch=H-pt.t-pt.b;
  const vals=[...dadosCIA,...dadosArea].filter(v=>v!==null);
  const maxV=100;

  function pathFor(dados,color){
    const pts=dados.map((v,i)=>({x:pt.l+(i/(dados.length-1||1))*cw,y:v!==null?pt.t+ch-(v/maxV)*ch:null}));
    const segs=[];let cur=[];
    pts.forEach(p=>{if(p.y!==null){cur.push(p)}else{if(cur.length>1)segs.push(cur);cur=[]}});
    if(cur.length>1)segs.push(cur);
    return segs.map(s=>`<path d="M ${s.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`
      +s.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" text-anchor="middle" fill="${color}" font-size="10" font-weight="600" font-family="Segoe UI">${p.y!==null?dados[s.indexOf(p)]+'%':''}</text>`).join('')
    ).join('');
  }

  const svgYLabels=[0,25,50,75,100].map(v=>{
    const y=pt.t+ch-(v/maxV)*ch;
    return`<line x1="${pt.l}" y1="${y.toFixed(1)}" x2="${pt.l+cw}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>
    <text x="${pt.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#9ca3af" font-size="10" font-family="Segoe UI">${v}%</text>`;
  }).join('');

  const svgXLabels=mesesDoAno.map(({label},i)=>{
    const x=pt.l+(i/(mesesDoAno.length-1))*cw;
    return`<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#9ca3af" font-size="10" font-family="Segoe UI">${label}</text>`;
  }).join('');

  const svg=`<svg width="${W}" height="${H}" style="overflow:visible;display:block">
    ${svgYLabels}${svgXLabels}
    ${pathFor(dadosCIA,'#1a4fa0')}
    ${pathFor(dadosArea,'#e8621a')}
  </svg>`;

  el.innerHTML=`
  <div class="card" style="margin-bottom:16px">
    <div class="ch"><div class="ct">Progresso mensal — ${ano}</div>
      <div style="display:flex;gap:14px;font-size:11px">
        <div style="display:flex;align-items:center;gap:5px"><div style="width:14px;height:3px;background:#1a4fa0;border-radius:2px"></div> CIA</div>
        <div style="display:flex;align-items:center;gap:5px"><div style="width:14px;height:3px;background:#e8621a;border-radius:2px"></div> ${areaLabel}</div>
      </div>
    </div>
    <div class="cb chart-wrap">${svg}</div>
  </div>

  <div class="card">
    <div class="ch"><div class="ct">Tabela — ${areaLabel} — ${ano}</div></div>
    <div class="cb" style="padding:0">
      <table>
        <thead><tr><th>Mês</th><th>Progresso CIA</th><th>Progresso ${areaLabel}</th></tr></thead>
        <tbody>${mesesDoAno.map(({label},i)=>`<tr>
          <td style="font-weight:600">${label}/${ano}</td>
          <td>${dadosCIA[i]!==null?`${pb(dadosCIA[i])}<div style="font-size:10px;font-weight:700;text-align:right">${dadosCIA[i]}%</div>`:'<span style="color:var(--gray-mid)">sem dados</span>'}</td>
          <td>${dadosArea[i]!==null?`${pb(dadosArea[i])}<div style="font-size:10px;font-weight:700;text-align:right">${dadosArea[i]}%</div>`:'<span style="color:var(--gray-mid)">sem dados</span>'}</td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
}

async function pArvore(){
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">🌳 Árvore OKR</div><div class="ps">Hierarquia completa com pesos e progresso</div></div></div>
  <div class="cnt">
    <div class="fb">
      <span class="fl">📅 Mês:</span>
      <select class="fs" id="arv-mes" onchange="lArvore()">${mesOpts(new Date().getMonth()+1)}</select>
      <select class="fs" id="arv-ano" onchange="lArvore()">${anoOpts()}</select>
      <div class="fd"></div>
      <span class="fl">🔍 Área:</span>
      <select class="fs" id="arv-area" onchange="lArvore()">${''}</select>
    </div>
    <div id="arv-content">${ld()}</div>
  </div>`;
  await loadAll();
  document.getElementById('arv-area').innerHTML=areaOpts('');
  lArvore();

function lArvore(){
  const mes=parseInt(document.getElementById('arv-mes')?.value)||new Date().getMonth()+1;
  const ano=parseInt(document.getElementById('arv-ano')?.value)||new Date().getFullYear();
  const af=document.getElementById('arv-area')?.value||'';
  const el=document.getElementById('arv-content');if(!el)return;

  const cokrs=DB.cokrs;
  if(!cokrs.length){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-mid)">Nenhum OKR da companhia cadastrado.</div>';return}

  el.innerHTML=cokrs.map(co=>{
    const prog=calcCOKR(co,mes,ano);
    const aokrs=DB.aokrs.filter(ao=>ao.okr_companhia_id==co.id&&(!af||ao.area===af));
    const areas=[...new Set(aokrs.map(ao=>ao.area).filter(Boolean))];
    const pesoCO=areas.length>0?peso(areas.length):0;

    return`<div class="tree-node" style="margin-bottom:16px">
      <div class="tree-item" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="background:var(--blue-light);border-color:var(--blue)">
        <span style="font-size:16px">🏢</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:700;color:var(--blue)">${co.nome}</div>
          <div style="font-size:10px;color:var(--gray-mid)">OKR Companhia · ${areas.length} áreas vinculadas · peso por área: ${pesoCO}%</div>
        </div>
        <div style="text-align:right"><div style="font-size:14px;font-weight:800;color:${prog>=60?'var(--success)':prog>=40?'var(--warning)':'var(--danger)'}">${prog}%</div>${pb(prog)}</div>
      </div>
      <div class="tree-child">
        ${aokrs.map(ao=>{
          const progAO=calcAOKR(ao,mes,ano);
          const krs=DB.krs.filter(k=>k.okr_area_id==ao.id);
          const pesoAO=krs.length>0?peso(krs.length):0;
          return`<div class="tree-item" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="background:var(--orange-light);border-color:var(--orange-border)">
            <span style="font-size:14px">📋</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:700">${ao.nome}</div>
              <div style="font-size:10px;color:var(--gray-mid)">${ao.area} · 👤 ${ao.responsavel||'—'} · ${krs.length} KRs · peso por KR: ${pesoAO}%</div>
            </div>
            <div style="text-align:right"><div style="font-size:13px;font-weight:800;color:${progAO>=60?'var(--success)':progAO>=40?'var(--warning)':'var(--danger)'}">${progAO}%</div>${pb(progAO)}</div>
          </div>
          <div class="tree-child" style="display:none">
            ${krs.map(k=>{
              const progKR=calcKR(k,mes,ano);
              const inits=DB.inits.filter(i=>i.kr_id==k.id&&i.status!=='Cancelada');
              const pesoKR=k.tipo==='Projeto'&&inits.length>0?peso(inits.length):0;
              return`<div class="tree-item" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'" style="background:#f0fdf4;border-color:#bbf7d0">
                <span style="font-size:12px">${k.tipo==='KPI'?'📊':'🎯'}</span>
                <div style="flex:1;min-width:0">
                  <div style="font-size:12px;font-weight:600">${k.nome}</div>
                  <div style="font-size:10px;color:var(--gray-mid)">${k.tipo}${k.tipo==='KPI'?' · '+k.indicador+' · meta: '+k.unidade+' '+(parseFloat(k.meta)||0).toLocaleString('pt-BR'):''}${k.tipo==='Projeto'?' · '+inits.length+' iniciativas · peso: '+pesoKR+'% cada':''}</div>
                </div>
                <div style="text-align:right"><div style="font-size:12px;font-weight:800;color:${progKR>=60?'var(--success)':progKR>=40?'var(--warning)':'var(--danger)'}">${progKR}%</div>${pb(progKR)}</div>
              </div>
              <div class="tree-child" style="display:none">
                ${inits.map(i=>{
                  const snap=snapAteMes('iniciativa',i.id,mes,ano);
                  const st=snap?snap.status:i.status;
                  const pct=PCT_STATUS[st]||0;
                  return`<div class="tree-item" style="cursor:default">
                    <span style="font-size:11px">✅</span>
                    <div style="flex:1;min-width:0">
                      <div style="font-size:11px;font-weight:600">${i.nome}</div>
                      <div style="font-size:10px;color:var(--gray-mid)">👤 ${i.responsavel||'—'} · Prazo: ${i.data_fim||'—'}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px">${bdg(st)}<div style="font-size:11px;font-weight:700;min-width:28px;text-align:right">${pct}%</div></div>
                  </div>`;
                }).join('')||'<div style="font-size:11px;color:var(--gray-mid);padding:8px">Sem iniciativas</div>'}
              </div>`;
            }).join('')||'<div style="font-size:11px;color:var(--gray-mid);padding:8px">Sem KRs</div>'}
          </div>`;
        }).join('')||'<div style="font-size:11px;color:var(--gray-mid);padding:8px">Sem OKRs de área'+(af?' para '+af:'')+' vinculados</div>'}
      </div>
    </div>`;
  }).join('');
}

// RANKING — responsável com melhor média
// ════════════════════════════════════════
async function pRank(){
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">🏆 Ranking de Desempenho</div><div class="ps">Responsável com melhor média de OKRs de área</div></div></div>
  <div class="cnt">
    <div class="fb"><span class="fl">📅 Mês:</span>
      <select class="fs" id="rm" onchange="lRank()">${mesOpts(new Date().getMonth()+1)}</select>
      <select class="fs" id="ra" onchange="lRank()">${anoOpts()}</select>
    </div>
    <div id="rc">${ld()}</div>
  </div>`;
  await loadAll();lRank();
}

function lRank(){
  const mes=parseInt(document.getElementById('rm')?.value)||new Date().getMonth()+1;
  const ano=parseInt(document.getElementById('ra')?.value)||new Date().getFullYear();
  const mesLabel=`${MOS[mes-1]}/${ano}`;

  // Agrupa OKRs por responsável
  const porResp={};
  DB.aokrs.forEach(ao=>{
    const resp=ao.responsavel||'(sem responsável)';
    if(!porResp[resp])porResp[resp]={nome:resp,area:ao.area,progs:[]};
    porResp[resp].progs.push(calcAOKR(ao,mes,ano));
  });

  const dados=Object.values(porResp).map(r=>({
    ...r,
    pct:r.progs.length?Math.round(r.progs.reduce((s,p)=>s+p,0)/r.progs.length):0,
    nOkrs:r.progs.length

  </div>`}).join(''):'<div style="background:var(--gray-lighter);border-radius:8px;padding:14px;text-align:center;color:var(--gray-mid);margin-bottom:14px">Nenhum KR KPI para esta seleção.</div>'}

  <div style="font-size:12px;font-weight:700;margin:14px 0 10px;color:var(--gray-dark)">🎯 Iniciativas — ${mesLabel}</div>
  ${ai.length?ai.map(i=>{
    const snapEx=snapAteMes('iniciativa',i.id,mes,ano);
    return`<div class="card" style="margin-bottom:8px">
    <div class="ch"><div><div class="ct">${i.nome}</div><div style="font-size:10px;color:var(--gray-mid)">Prazo: ${i.data_fim||'—'} · Status atual cadastrado: ${i.status||'Não iniciada'}</div></div>${bdg(snapEx?.status||i.status||'Não iniciada')}</div>
    <div class="cb">
      <div class="fr">
        <div class="fg"><label class="flb">Status em ${mesLabel}</label>
          <select class="fsl" id="is-${i.id}">${STATUS_INIT.map(s=>`<option${(snapEx?.status||i.status)===s?' selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="fg"><label class="flb">Comentário</label><input class="fi" id="ic-${i.id}" value="${snapEx?.comentario||''}" placeholder="O que aconteceu em ${mesLabel}?"/></div>
      </div>
    </div>
  </div>`}).join(''):'<div style="background:var(--gray-lighter);border-radius:8px;padding:14px;text-align:center;color:var(--gray-mid)">Nenhuma iniciativa para esta seleção.</div>'}

  ${(kpis.length||ai.length)?`<div style="margin-top:18px;padding-top:14px;border-top:2px solid var(--border);display:flex;justify-content:flex-end">
    <button class="btn bp" style="font-size:13px;padding:9px 22px" id="btn-gravar" onclick="gravarTodos(${JSON.stringify(kpis.map(k=>k.id)).replace(/"/g,"&quot;")},${JSON.stringify(ai.map(i=>i.id)).replace(/"/g,"&quot;")},${mes},${ano})">
      💾 Gravar todos os snapshots de ${mesLabel} e recalcular cascata
    </button>
  </div>`:''}`;
}

async function gravarTodos(kpiIds,initIds,mes,ano){
  const btn=document.getElementById('btn-gravar');
  btn.disabled=true;btn.textContent='Gravando e recalculando...';
  const mesLabel=`${MOS[mes-1]}/${ano}`;
  let ok=0,erros=0;

  // Grava snapshots de KPIs
  for(const id of kpiIds){
    const k=DB.krs.find(x=>x.id==id);if(!k)continue;
    const atual=parseFloat(document.getElementById(`kc-${id}`)?.value)||0;
    const meta=parseFloat(document.getElementById(`km-${id}`)?.value)||1;
    const saude=document.getElementById(`ks-${id}`)?.value||'green';
    const com=document.getElementById(`kcom-${id}`)?.value||'';
    const prog=k.indicador==='decrescente'?Math.min(Math.round((meta/atual)*100),100):Math.min(Math.round((atual/meta)*100),100);
    const r=await apiSnap({tipo:'kr',item_id:id,mes,ano,valor_atual:atual,meta,saude,pct:prog,comentario:com,status:''});
    r.ok?ok++:erros++;
  }

  // Grava snapshots de iniciativas
  for(const id of initIds){
    const i=DB.inits.find(x=>x.id==id);if(!i)continue;
    const st=document.getElementById(`is-${id}`)?.value||i.status;
    const com=document.getElementById(`ic-${id}`)?.value||'';
    const pct=PCT_STATUS[st]||0;
    const r=await apiSnap({tipo:'iniciativa',item_id:id,mes,ano,status:st,pct,comentario:com,valor_atual:'',meta:'',saude:'green'});
    r.ok?ok++:erros++;
  }

  // Recalcula cascata: grava snapshot de OKR Área e OKR Companhia
  await loadAll(); // Recarrega com novos snapshots
  const areasUnicas=[...new Set(DB.aokrs.map(ao=>ao.area).filter(Boolean))];
  for(const ao of DB.aokrs){
    const prog=calcAOKR(ao,mes,ano);
    await apiSnap({tipo:'okr_area',item_id:ao.id,mes,ano,pct:prog,status:'',valor_atual:'',meta:'',saude:prog>=60?'green':prog>=40?'yellow':'red',comentario:''});
  }
  for(const co of DB.cokrs){
    const prog=calcCOKR(co,mes,ano);
    await apiSnap({tipo:'okr_companhia',item_id:co.id,mes,ano,pct:prog,status:'',valor_atual:'',meta:'',saude:prog>=60?'green':prog>=40?'yellow':'red',comentario:''});
  }

  if(erros===0){toast(`✅ ${ok} snapshots gravados para ${mesLabel}! Cascata recalculada.`);}
  else{toast(`⚠️ ${ok} gravados, ${erros} com erro.`,'err');}
  btn.disabled=false;btn.textContent=`💾 Gravar todos os snapshots de ${mesLabel} e recalcular cascata`;
}

// APROVAÇÕES
// ════════════════════════════════════════
async function pApprov(){
  document.getElementById('main').innerHTML=`
  <div class="ph"><div><div class="pt">Aprovações</div><div class="ps">Fluxo de aprovação de OKRs e KRs</div></div></div>
  <div class="cnt">
    <div class="tabs"><div class="tab active" onclick="lApprov('Pendente',this)">Pendentes</div><div class="tab" onclick="lApprov('Aprovado',this)">Aprovados</div><div class="tab" onclick="lApprov('Reprovado',this)">Reprovados</div></div>
    <div id="al">${ld()}</div>
  </div>`;
  await lApprov('Pendente',null);
}
async function lApprov(f,el){
  if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
  const all=await apiG('aprovacoes');
  const items=all.filter(a=>a.status===f);
  document.getElementById('bc').textContent=all.filter(a=>a.status==='Pendente').length;
  const cont=document.getElementById('al');if(!cont)return;
  if(!items.length){cont.innerHTML='<div style="text-align:center;padding:36px;color:var(--gray-mid)">✅ Nenhum item nesta categoria</div>';return}
  cont.innerHTML=items.map(a=>`<div style="background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px">
    <div style="width:36px;height:36px;border-radius:9px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">${a.tipo?.includes('Key')?'📊':'🏬'}</div>
    <div style="flex:1;min-width:0"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><div style="font-size:12px;font-weight:700;margin-bottom:2px">${a.nome}</div>
        <div style="font-size:10px;color:var(--gray-mid)">${a.tipo} · ${a.area} · por <strong>${a.solicitante}</strong> em ${a.data}</div>
      </div>
      <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">${bdg(a.status)}
        ${a.status==='Pendente'?`<button class="btn bsc bsm" onclick='dApprov("${a.id}","Aprovado",${JSON.stringify(a).replace(/"/g,"&quot;")})'>✓ Aprovar</button><button class="btn bsd bsm" onclick='dApprov("${a.id}","Reprovado",${JSON.stringify(a).replace(/"/g,"&quot;")})'>✕ Reprovar</button>`:''}
      </div>
    </div></div>
  </div>`).join('');
}
async function dApprov(id,dec,a){
  const r=await apiU('aprovacoes',{...a,id,status:dec,aprovado_por:'Admin'});
  if(r.ok){toast(`${dec}! ✅`);pApprov();}else toast('Erro: '+(r.erro||''),'err');
}
