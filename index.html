<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKR Suite Piacentini</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1f2e;min-height:100vh;display:flex}
:root{--orange:#e8621a;--orange-light:#fff3ec;--orange-border:#fcd7bc;--blue:#1a4fa0;--blue-light:#e8f0fb;--gray-dark:#2d3142;--gray-mid:#6b7280;--gray-lighter:#f7f8fa;--white:#fff;--border:#e2e5eb;--border2:#d1d5de;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--nav-w:220px}
nav{width:var(--nav-w);min-height:100vh;background:var(--gray-dark);display:flex;flex-direction:column;position:fixed;left:0;top:0;z-index:100;overflow-y:auto}
.nl{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:9px}
.ni{width:30px;height:30px;background:var(--orange);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0}
.nt{font-weight:700;font-size:13px;color:#fff}.ns{font-size:9px;color:rgba(255,255,255,.4)}
.sec{padding:10px 12px 2px;font-size:9px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.3);text-transform:uppercase}
.nm{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:1px 5px;border-radius:7px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.6);transition:all .15s}
.nm:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
.nm.active{background:var(--orange);color:#fff}
.nicon{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--orange);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px}
.nm.active .nbadge{background:rgba(255,255,255,.3)}
.nb{margin-top:auto;padding:10px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.nu{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 8px;border-radius:7px}
.nu:hover{background:rgba(255,255,255,.07)}
.nav-av{width:30px;height:30px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex-shrink:0;overflow:hidden}
.nav-av img{width:100%;height:100%;object-fit:cover}
.nav-un{font-size:11px;font-weight:600;color:#fff}.nav-ur{font-size:9px;color:rgba(255,255,255,.4)}
main{margin-left:var(--nav-w);flex:1;background:#f0f2f5;min-height:100vh}
.ph{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px}
.pt{font-size:18px;font-weight:700;color:var(--gray-dark)}.ps{font-size:12px;color:var(--gray-mid);margin-top:2px}
.cnt{padding:16px 24px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s}
.bp{background:var(--orange);color:#fff}.bp:hover{background:#d0561a}
.bg{background:var(--white);color:var(--gray-mid);border:1px solid var(--border2)}.bg:hover{background:var(--gray-lighter)}
.bsm{padding:4px 9px;font-size:11px}
.bsc{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.bsd{background:#fef2f2;color:var(--danger);border:1px solid #fecaca}
.blg{background:var(--blue);color:#fff}.blg:hover{background:#163d7e}
.card{background:var(--white);border:1px solid var(--border);border-radius:11px}
.ch{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px}
.ct{font-size:12px;font-weight:700;color:var(--gray-dark)}.cb{padding:15px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}
.mc{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:13px 15px}
.ml{font-size:10px;color:var(--gray-mid);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.mv{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1;color:var(--gray-dark)}
.fb{background:var(--white);border:1px solid var(--border);border-radius:9px;padding:9px 13px;display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
.fl{font-size:11px;font-weight:600;color:var(--gray-mid);white-space:nowrap}
.fs{background:var(--gray-lighter);border:1px solid var(--border2);border-radius:6px;padding:5px 8px;font-size:11px;color:var(--gray-dark);cursor:pointer;font-family:inherit}
.fd{width:1px;height:16px;background:var(--border2)}
.pb{height:6px;background:#eee;border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .5s}
.pg{background:var(--success)}.po{background:var(--orange)}.pr{background:var(--danger)}.pbl{background:var(--blue)}
.bdg{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600}
.bg2{background:#dcfce7;color:#166534}.by{background:#fef9c3;color:#854d0e}
.br2{background:#fef2f2;color:#991b1b}.bb{background:var(--blue-light);color:var(--blue)}
.bor{background:var(--orange-light);color:#92400e}.bgr{background:#f3f4f6;color:#374151}.bpu{background:#f5f3ff;color:#6d28d9}
.bdot{width:4px;height:4px;border-radius:50%;background:currentColor}
.hd{width:8px;height:8px;border-radius:50%;flex-shrink:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 11px;text-align:left;font-size:9px;font-weight:700;color:var(--gray-mid);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--gray-lighter)}
td{padding:9px 11px;border-bottom:1px solid var(--border);color:var(--gray-dark);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:#fafbfc}
.tabs{display:flex;background:#edf0f5;border-radius:7px;padding:2px;margin-bottom:14px;width:fit-content}
.tab{padding:5px 11px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;color:var(--gray-mid);transition:all .15s;white-space:nowrap}
.tab.active{background:var(--white);color:var(--orange);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.fg{margin-bottom:11px}
.flb{font-size:11px;font-weight:600;color:var(--gray-dark);margin-bottom:4px;display:block}
.fi,.fsl,.fta{width:100%;background:var(--white);border:1px solid var(--border2);border-radius:7px;padding:7px 9px;font-size:12px;color:var(--gray-dark);outline:none;transition:border .15s;font-family:inherit}
.fi:focus,.fsl:focus,.fta:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(232,98,26,.1)}
.fta{resize:vertical;min-height:60px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.ua{border:2px dashed var(--border2);border-radius:9px;padding:18px;text-align:center;cursor:pointer;background:var(--gray-lighter)}
.ua:hover{border-color:var(--orange);background:var(--orange-light)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:32px;overflow-y:auto}
.md{background:var(--white);border-radius:13px;width:560px;max-width:95vw;border:1px solid var(--border);margin-bottom:32px}
.mh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mt{font-size:14px;font-weight:700;color:var(--gray-dark)}
.mbd{padding:18px;max-height:60vh;overflow-y:auto}
.mf{padding:11px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.mc2{width:24px;height:24px;border-radius:5px;background:var(--gray-lighter);border:none;cursor:pointer;color:var(--gray-mid);font-size:15px;display:flex;align-items:center;justify-content:center}
.oi{background:var(--white);border:1px solid var(--border);border-radius:9px;margin-bottom:7px}
.oh{padding:11px 14px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:background .15s;border-radius:9px}
.oh:hover{background:var(--gray-lighter)}
.on{font-size:12px;font-weight:700;color:var(--gray-dark);margin-bottom:2px}
.om{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--gray-mid);flex-wrap:wrap}
.chv{font-size:10px;color:var(--gray-mid);transition:transform .2s;flex-shrink:0}
.chv.open{transform:rotate(90deg)}
.oc{padding:0 11px 11px;display:none}.oc.open{display:block}
.kr-row{background:var(--gray-lighter);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin-bottom:5px;display:flex;align-items:center;gap:9px}
.ld{display:flex;align-items:center;justify-content:center;padding:32px;color:var(--gray-mid);font-size:13px;gap:9px}
.sp{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:18px;right:18px;background:var(--gray-dark);color:#fff;padding:9px 16px;border-radius:9px;font-size:12px;font-weight:500;z-index:9999;opacity:0;transform:translateY(8px);transition:all .3s}
.toast.show{opacity:1;transform:translateY(0)}.toast.ok{background:var(--success)}.toast.err{background:var(--danger)}
.uc{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:13px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:all .15s}
.uc:hover{border-color:var(--orange);background:var(--orange-light)}
.ac{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:13px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:all .15s}
.ac:hover{border-color:var(--orange);background:var(--orange-light)}
.pw{font-size:9px;font-weight:700;color:var(--blue);background:var(--blue-light);padding:2px 5px;border-radius:4px;white-space:nowrap}
.alert-card{background:#fef9c3;border:1px solid #fde68a;border-radius:9px;padding:10px 13px;margin-bottom:7px;display:flex;align-items:flex-start;gap:9px}
.tree-child{margin-left:20px;border-left:2px solid var(--border2);padding-left:10px;margin-top:3px}
.tree-item{background:var(--white);border:1px solid var(--border);border-radius:7px;padding:9px 12px;margin-bottom:5px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s}
.tree-item:hover{background:var(--gray-lighter)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#d1d5de;border-radius:3px}
</style>
</head>
<body>
<nav>
  <div class="nl"><div class="ni">O</div><div><div class="nt">OKR Suite</div><div class="ns">Piacentini</div></div></div>
  <div class="sec">Principal</div>
  <div class="nm active" onclick="go('dashboard')"><span class="nicon">⊞</span> Dashboard</div>
  <div class="nm" onclick="go('evolucao')"><span class="nicon">📈</span> Evolução Histórica</div>
  <div class="nm" onclick="go('arvore')"><span class="nicon">🌳</span> Árvore OKR</div>
  <div class="nm" onclick="go('ranking')"><span class="nicon">🏆</span> Ranking</div>
  <div class="sec">Cadastros</div>
  <div class="nm" onclick="go('areas')"><span class="nicon">🏬</span> Áreas</div>
  <div class="nm" onclick="go('usuarios')"><span class="nicon">👥</span> Usuários</div>
  <div class="sec">OKRs</div>
  <div class="nm" onclick="go('company-okrs')"><span class="nicon">🏢</span> OKR Companhia</div>
  <div class="nm" onclick="go('area-okrs')"><span class="nicon">📋</span> OKR por Área</div>
  <div class="nm" onclick="go('key-results')"><span class="nicon">📊</span> Key Results</div>
  <div class="nm" onclick="go('initiatives')"><span class="nicon">✅</span> Iniciativas</div>
  <div class="sec">Manutenção</div>
  <div class="nm" onclick="go('manutencao')"><span class="nicon">🔄</span> Atualizar Status</div>
  <div class="sec">Admin</div>
  <div class="nm" onclick="go('approvals')"><span class="nicon">✔</span> Aprovações <span class="nbadge" id="bc">0</span></div>
  <div class="nb">
    <div class="nu" onclick="go('usuarios')">
      <div class="nav-av" id="nav-av">A</div>
      <div><div class="nav-un" id="nav-nm">Admin</div><div class="nav-ur" id="nav-rl">Administrador</div></div>
    </div>
  </div>
</nav>
<main id="main"></main>
<div id="mr"></div>
<div class="toast" id="toast"></div>
<script>
const GAS='https://script.google.com/macros/s/AKfycbwnAdAcSaTnD6BxKYBxgsRwZqRbi1oSZsEZ00qe7m7cD4mpe8NYhojDiLt3F3dNOq8_wQ/exec';
const MOS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const STATUS_INIT=['Não iniciada','Em andamento','Concluída','Cancelada','Pausada','Concluída com atraso'];
const CORS=['#e8621a','#1a4fa0','#16a34a','#7c3aed','#0891b2','#dc2626','#d97706','#0d9488'];
const PCT_STATUS={'Concluída':100,'Concluída com atraso':100,'Em andamento':50,'Não iniciada':0,'Cancelada':0,'Pausada':0};
let DB={users:[],areas:[],aokrs:[],cokrs:[],krs:[],inits:[],snaps:[]};

function toast(msg,t='ok'){const e=document.getElementById('toast');e.textContent=msg;e.className=`toast show ${t}`;setTimeout(()=>e.className='toast',3500)}
function enc(o){try{return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}catch(e){return btoa(JSON.stringify(o))}}
async function apiG(a){try{const r=await fetch(`${GAS}?acao=listar&aba=${a}`);return(await r.json()).dados||[]}catch{return[]}}
async function apiP(a,b){try{const r=await fetch(`${GAS}?acao=criar&aba=${a}&body=${enc(b)}&enc=b64`);return await r.json()}catch(e){return{ok:false,erro:e.message}}}
async function apiU(a,b){try{const r=await fetch(`${GAS}?acao=atualizar&aba=${a}&body=${enc(b)}&enc=b64`);return await r.json()}catch(e){return{ok:false,erro:e.message}}}
async function apiSnap(b){try{const r=await fetch(`${GAS}?acao=snapshot&aba=snapshots&body=${enc(b)}&enc=b64`);return await r.json()}catch(e){return{ok:false,erro:e.message}}}
async function loadAll(){const r=await Promise.all([apiG('usuarios'),apiG('areas'),apiG('okr_area'),apiG('okr_companhia'),apiG('key_results'),apiG('iniciativas'),apiG('snapshots')]);DB={users:r[0],areas:r[1],aokrs:r[2],cokrs:r[3],krs:r[4],inits:r[5],snaps:r[6]}}

// CÁLCULO EM CASCATA
function snapAteMes(tipo,id,mes,ano){const rel=DB.snaps.filter(s=>s.tipo===tipo&&s.item_id==id&&(parseInt(s.ano)<ano||(parseInt(s.ano)===ano&&parseInt(s.mes)<=mes)));if(!rel.length)return null;return rel.sort((a,b)=>(parseInt(b.ano)*12+parseInt(b.mes))-(parseInt(a.ano)*12+parseInt(a.mes)))[0]}
function calcKPI(k,snap){const v=parseFloat(snap?.valor_atual??k.atual)||0;const m=parseFloat(k.meta)||1;return k.indicador==='decrescente'?Math.min(Math.round((m/v)*100),100):Math.min(Math.round((v/m)*100),100)}
function calcKR(k,mes,ano){if(k.tipo==='KPI'){return calcKPI(k,snapAteMes('kr',k.id,mes,ano))}const mine=DB.inits.filter(i=>i.kr_id==k.id&&i.status!=='Cancelada');if(!mine.length)return 0;return Math.round(mine.map(i=>{const s=snapAteMes('iniciativa',i.id,mes,ano);return s?parseInt(s.pct)||0:PCT_STATUS[i.status]||0}).reduce((a,b)=>a+b,0)/mine.length)}
function calcAOKR(ao,mes,ano){const krs=DB.krs.filter(k=>k.okr_area_id==ao.id);if(!krs.length)return 0;return Math.round(krs.map(k=>calcKR(k,mes,ano)).reduce((a,b)=>a+b,0)/krs.length)}
function calcCOKR(co,mes,ano){const areas=[...new Set(DB.aokrs.filter(a=>a.okr_companhia_id==co.id).map(a=>a.area).filter(Boolean))];if(!areas.length)return 0;return Math.round(areas.map(area=>{const list=DB.aokrs.filter(a=>a.okr_companhia_id==co.id&&a.area===area);return list.length?Math.round(list.map(ao=>calcAOKR(ao,mes,ano)).reduce((a,b)=>a+b,0)/list.length):0}).reduce((a,b)=>a+b,0)/areas.length)}

// HELPERS
function hc(p){p=parseInt(p)||0;return p>=60?'pg':p>=40?'po':'pr'}
function pb(p){p=parseInt(p)||0;return`<div class="pb"><div class="pf ${hc(p)}" style="width:${Math.min(p,100)}%"></div></div>`}
function pbl(p){p=parseInt(p)||0;return`<div class="pb"><div class="pf pbl" style="width:${Math.min(p,100)}%"></div></div>`}
function bdg(t){const m={'Publicado':'bg2','Pendente':'by','Em andamento':'bb','Concluída':'bg2','Não iniciada':'bgr','Cancelada':'br2','Aprovado':'bg2','Reprovado':'br2','Concluída com atraso':'by','Pausada':'bpu','ADM':'bor','CEO':'bb','GESTOR':'bg2'};return`<span class="bdg ${m[t]||'bgr'}">${t}</span>`}
function hbdg(h){const m={green:'bg2',yellow:'by',red:'br2'};const l={green:'No prazo',yellow:'Atenção',red:'Em risco'};return`<span class="bdg ${m[h]||'bgr'}"><span class="bdot"></span>${l[h]||h}</span>`}
function ld(){return`<div class="ld"><div class="sp"></div> Carregando...</div>`}
function ini(n){return(n||'?').split(' ').map(x=>x[0]||'').slice(0,2).join('').toUpperCase()||'?'}
function corN(n){let h=0;for(let c of(n||''))h=(h*31+c.charCodeAt(0))%CORS.length;return CORS[h]}
function av(n,s=32,f=''){if(f&&f.startsWith('data:'))return`<div style="width:${s}px;height:${s}px;border-radius:50%;overflow:hidden;flex-shrink:0"><img src="${f}" style="width:100%;height:100%;object-fit:cover"></div>`;return`<div style="width:${s}px;height:${s}px;border-radius:50%;background:${corN(n)};display:flex;align-items:center;justify-content:center;font-size:${Math.round(s*.3)}px;font-weight:800;color:#fff;flex-shrink:0">${ini(n)}</div>`}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;')}
function mesOpts(sel){return MOS.map((m,i)=>`<option value="${i+1}"${parseInt(sel)===i+1?' selected':''}>${m}</option>`).join('')}
function anoOpts(){const y=new Date().getFullYear();return[y-1,y,y+1].map(a=>`<option value="${a}"${a===y?' selected':''}>${a}</option>`).join('')}
function uOpts(s){return`<option value="">— Selecione —</option>`+DB.users.map(u=>`<option value="${esc(u.nome)}"${u.nome===s?' selected':''}>${u.nome}${u.area?' ('+u.area+')':''}</option>`).join('')}
function aOpts(s,p='Todas as Áreas'){return`<option value="">${p}</option>`+DB.areas.filter(a=>a.ativo!=='não').map(a=>`<option value="${esc(a.nome)}"${a.nome===s?' selected':''}>${a.nome}</option>`).join('')}
function peso(n){return n>0?Math.round(10000/n)/100:0}
function go(p){document.querySelectorAll('.nm').forEach(n=>n.classList.remove('active'));const idx={dashboard:0,evolucao:1,arvore:2,ranking:3,areas:5,usuarios:6,'company-okrs':8,'area-okrs':9,'key-results':10,initiatives:11,manutencao:13,approvals:15};const items=document.querySelectorAll('.nm');if(items[idx[p]])items[idx[p]].classList.add('active');({dashboard:pDash,evolucao:pEvol,arvore:pArvore,ranking:pRank,areas:pAreas,usuarios:pUsers,'company-okrs':pCOkr,'area-okrs':pAOkr,'key-results':pKR,initiatives:pInit,manutencao:pMaint,approvals:pApprov})[p]?.()}
function openM(h){document.getElementById('mr').innerHTML=`<div class="mo" onclick="if(event.target===this)closeM()">${h}</div>`}
function closeM(){document.getElementById('mr').innerHTML=''}
function tog(id){const c=document.getElementById(`oc-${id}`),v=document.getElementById(`cv-${id}`);const o=c.classList.contains('open');c.classList.toggle('open',!o);v.classList.toggle('open',!o);v.textContent=o?'▶':'▼'}
// DASHBOARD
async function pDash(){const now=new Date();document.getElementById('main').innerHTML=`<div class="ph"><div><div class="pt">Dashboard Executivo</div><div class="ps">Progresso calculado automaticamente em cascata</div></div><button class="btn blg bsm" onclick="exportPDF()">⬇ PDF</button></div><div class="cnt"><div class="fb"><span class="fl">🔍 Área:</span><select class="fs" id="fa" onchange="lDash()"></select><div class="fd"></div><span class="fl">📅 Mês:</span><select class="fs" id="fmes" onchange="lDash()">${mesOpts(now.getMonth()+1)}</select><select class="fs" id="fano" onchange="lDash()">${anoOpts()}</select></div><div id="dc">${ld()}</div></div>`;await loadAll();document.getElementById('fa').innerHTML=aOpts('');lDash()}
function lDash(){const af=document.getElementById('fa')?.value||'';const mes=parseInt(document.getElementById('fmes')?.value)||new Date().getMonth()+1;const ano=parseInt(document.getElementById('fano')?.value)||new Date().getFullYear();const ml=`${MOS[mes-1]}/${ano}`;const el=document.getElementById('dc');if(!el)return;const aof=af?DB.aokrs.filter(o=>o.area===af):DB.aokrs;const tp=aof.length?Math.round(aof.map(ao=>calcAOKR(ao,mes,ano)).reduce((a,b)=>a+b,0)/aof.length):0;const cokrsPct=DB.cokrs.map(co=>{const ta=[...new Set(DB.aokrs.filter(a=>a.okr_companhia_id==co.id).map(a=>a.area).filter(Boolean))];const af2=af?ta.filter(a=>a===af):ta;const p=ta.length?Math.round(af2.length/ta.length*100):0;return{...co,_pc:p,_ta:ta.length,_af:af2.length,_pr:calcCOKR(co,mes,ano)}});const aofp=aof.map(ao=>({...ao,_pr:calcAOKR(ao,mes,ano)}));const hoje=new Date(ano,mes-1,28);const aInit=DB.inits.filter(i=>{if(!i.data_fim)return false;const d=new Date(i.data_fim);if(d.getMonth()!==mes-1||d.getFullYear()!==ano)return false;const s=snapAteMes('iniciativa',i.id,mes,ano);return(s?s.status:i.status)!=='Concluída'&&(s?s.status:i.status)!=='Concluída com atraso'});const aKR=DB.krs.filter(k=>{if(!k.data_fim)return false;const d=new Date(k.data_fim);return d.getMonth()===mes-1&&d.getFullYear()===ano&&calcKR(k,mes,ano)<100});apiG('aprovacoes').then(ap=>{const p=ap.filter(a=>a.status==='Pendente').length;document.getElementById('bc').textContent=p;const e=document.getElementById('pc');if(e)e.textContent=p});

// EVOLUÇÃO HISTÓRICA
async function pEvol(){document.getElementById('main').innerHTML=`<div class="ph"><div><div class="pt">📈 Evolução Histórica</div><div class="ps">Progresso mês a mês — CIA e por área</div></div></div><div class="cnt"><div class="fb"><span class="fl">🔍 Área:</span><select class="fs" id="ea" onchange="lEvol()"></select><div class="fd"></div><span class="fl">📅 Ano:</span><select class="fs" id="ean" onchange="lEvol()">${anoOpts()}</select></div><div id="ev-c">${ld()}</div></div>`;await loadAll();document.getElementById('ea').innerHTML=aOpts('');lEvol()}
function lEvol(){const af=document.getElementById('ea')?.value||'';const ano=parseInt(document.getElementById('ean')?.value)||new Date().getFullYear();const el=document.getElementById('ev-c');if(!el)return;const meses=MOS.map((m,i)=>({label:m,mes:i+1}));const dCIA=meses.map(({mes})=>{const p=DB.cokrs.map(co=>calcCOKR(co,mes,ano));return p.length?Math.round(p.reduce((a,b)=>a+b,0)/p.length):null});const dArea=meses.map(({mes})=>{const ao=af?DB.aokrs.filter(o=>o.area===af):DB.aokrs;if(!ao.length)return null;const p=ao.map(a=>calcAOKR(a,mes,ano));return Math.round(p.reduce((a,b)=>a+b,0)/p.length)});const W=Math.max(560,el.offsetWidth||620);const H=240;const pt={t:18,r:18,b:36,l:40};const cw=W-pt.l-pt.r,ch=H-pt.t-pt.b;function pathFor(d,col){const pts=d.map((v,i)=>({x:pt.l+(i/(d.length-1||1))*cw,y:v!==null?pt.t+ch-(v/100)*ch:null}));const segs=[];let cur=[];pts.forEach(p=>{p.y!==null?cur.push(p):(cur.length>1&&segs.push(cur),cur=[])});cur.length>1&&segs.push(cur);return segs.map(s=>`<path d="M ${s.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`+s.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${col}"/><text x="${p.x.toFixed(1)}" y="${(p.y-7).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="9" font-weight="600" font-family="Segoe UI">${d[s.indexOf?s.indexOf(p):0]??''}%</text>`).join('')).join('')}
const yLbls=[0,25,50,75,100].map(v=>{const y=pt.t+ch-(v/100)*ch;return`<line x1="${pt.l}" y1="${y.toFixed(1)}" x2="${pt.l+cw}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/><text x="${pt.l-5}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#9ca3af" font-size="9" font-family="Segoe UI">${v}%</text>`}).join('');const xLbls=meses.map(({label},i)=>`<text x="${(pt.l+(i/(meses.length-1))*cw).toFixed(1)}" y="${H-5}" text-anchor="middle" fill="#9ca3af" font-size="9" font-family="Segoe UI">${label}</text>`).join('');
el.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="ch"><div class="ct">Progresso mensal — ${ano}</div><div style="display:flex;gap:12px;font-size:10px"><div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:2px;background:#1a4fa0;border-radius:2px"></div>CIA</div><div style="display:flex;align-items:center;gap:4px"><div style="width:12px;height:2px;background:#e8621a;border-radius:2px"></div>${af||'Todas as Áreas'}</div></div></div><div class="cb" style="overflow-x:auto"><svg width="${W}" height="${H}" style="overflow:visible;display:block">${yLbls}${xLbls}${pathFor(dCIA,'#1a4fa0')}${pathFor(dArea,'#e8621a')}</svg></div></div>
<div class="card"><div class="ch"><div class="ct">Tabela — ${af||'Todas as Áreas'} — ${ano}</div></div><div class="cb" style="padding:0"><table><thead><tr><th>Mês</th><th>Progresso CIA</th><th>Progresso ${af||'Todas as Áreas'}</th></tr></thead><tbody>${meses.map(({label},i)=>`<tr><td style="font-weight:600">${label}/${ano}</td><td>${dCIA[i]!==null?pb(dCIA[i])+'<div style="font-size:10px;font-weight:700;text-align:right">'+dCIA[i]+'%</div>':'<span style="color:var(--gray-mid)">sem dados</span>'}</td><td>${dArea[i]!==null?pb(dArea[i])+'<div style="font-size:10px;font-weight:700;text-align:right">'+dArea[i]+'%</div>':'<span style="color:var(--gray-mid)">sem dados</span>'}</td></tr>`).join('')}</tbody></table></div></div>`}

async function mUser(u){const novo=!u;openM(`<div class="md"><div class="mh"><div class="mt">${novo?'Novo Usuário':`Editar — ${u.nome}`}</div><button class="mc2" onclick="closeM()">×</button></div><div class="mbd"><div style="text-align:center;margin-bottom:14px"><div class="ua" onclick="document.getElementById('pi').click()"><div style="width:60px;height:60px;border-radius:50%;background:var(--orange-light);border:2px solid var(--orange-border);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:22px;overflow:hidden" id="pp">${u&&u._foto?`<img src="${u._foto}" style="width:100%;height:100%;object-fit:cover">`:u?ini(u.nome):'📷'}</div><div style="font-size:11px;font-weight:600;color:var(--gray-mid)">Clique para enviar foto</div></div><input type="file" id="pi" accept="image/*" style="display:none" onchange="prvFoto(event)"/></div><div class="fr"><div class="fg"><label class="flb">Nome completo *</label><input class="fi" id="un" value="${esc(u?.nome||'')}" placeholder="Nome e sobrenome"/></div><div class="fg"><label class="flb">Área *</label><select class="fsl" id="ua"><option value="">— Selecione —</option>${DB.areas.filter(a=>a.ativo!=='não').map(a=>`<option value="${esc(a.nome)}"${u?.area===a.nome?' selected':''}>${a.nome}</option>`).join('')}</select></div></div><div class="fg"><label class="flb">E-mail *</label><input class="fi" id="ue" type="email" value="${esc(u?.email||'')}" placeholder="email@empresa.com"/></div><div class="fr"><div class="fg"><label class="flb">${novo?'Senha *':'Nova Senha'}</label><input class="fi" id="us" type="password" placeholder="••••••••"/></div><div class="fg"><label class="flb">Confirmar Senha</label><input class="fi" id="us2" type="password" placeholder="••••••••"/></div></div><div class="fg"><label class="flb">Tipo *</label><select class="fsl" id="ut"><option value="ADM"${u?.tipo==='ADM'?' selected':''}>ADM — Administrador</option><option value="CEO"${u?.tipo==='CEO'?' selected':''}>CEO</option><option value="GESTOR"${u?.tipo==='GESTOR'?' selected':''}>Gestor de Área</option></select></div><input type="hidden" id="foto-data" value=""/></div><div class="mf"><button class="btn bg" onclick="closeM()">Cancelar</button><button class="btn bp" id="bsu" onclick="svUser('${u?.id||''}','${esc(u?.criado_em||'')}')">💾 Salvar</button></div></div>`)}
function prvFoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{document.getElementById('pp').innerHTML=`<img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover">`;document.getElementById('foto-data').value=ev.target.result};r.readAsDataURL(f)}
async function svUser(id,ce){const btn=document.getElementById('bsu');const n=document.getElementById('un').value.trim(),e=document.getElementById('ue').value.trim(),area=document.getElementById('ua').value,s=document.getElementById('us').value,s2=document.getElementById('us2').value,foto=document.getElementById('foto-data').value;if(!n){toast('Informe o nome','err');return}if(!e){toast('Informe o e-mail','err');return}if(!area){toast('Selecione a área','err');return}if(!id&&!s){toast('Informe a senha','err');return}if(s&&s!==s2){toast('Senhas não conferem!','err');return}btn.disabled=true;btn.textContent='Salvando...';const body={nome:n,area,email:e,senha:s||'',tipo:document.getElementById('ut').value,foto:foto||''};const r=!id?await apiP('usuarios',body):await apiU('usuarios',{...body,id,ativo:'sim',criado_em:ce});if(r.ok){toast('Usuário salvo! ✅');closeM();DB.users=await apiG('usuarios');lUsers()}else{toast('Erro: '+(r.erro||''),'err');btn.disabled=false;btn.textContent='💾 Salvar'}}

function lCOkr(){const el=document.getElementById('col');if(!el)return;if(!DB.cokrs.length){el.innerHTML='<div style="background:var(--white);border:1px solid var(--border);border-radius:11px;padding:36px;text-align:center;color:var(--gray-mid)">Nenhum OKR cadastrado ainda.</div>';return}el.innerHTML=DB.cokrs.map(co=>{const areas=[...new Set(DB.aokrs.filter(a=>a.okr_companhia_id==co.id).map(a=>a.area).filter(Boolean))];const pc=areas.length>0?peso(areas.length):0;return`<div class="oi"><div class="oh" onclick="tog('c${co.id}')"><span class="chv" id="cv-c${co.id}">▶</span><div style="flex:1;min-width:0"><div class="on">${co.nome}</div><div class="om"><span>👤 ${co.responsavel||'—'}</span><span>📅 ${co.data_inicio||'—'} → ${co.data_fim||'—'}</span>${bdg(co.status||'Pendente')}<span class="pw">${areas.length} áreas · ${pc}% cada</span></div></div><div style="display:flex;align-items:center;gap:7px;min-width:170px">${pb(co.progresso)}<span style="font-size:12px;font-weight:800;min-width:30px;text-align:right">${co.progresso||0}%</span></div></div><div class="oc" id="oc-c${co.id}"><div style="font-size:9px;font-weight:700;color:var(--gray-mid);text-transform:uppercase;margin-bottom:6px">OKRs de Área vinculados — peso: ${pc}% cada área</div>${DB.aokrs.filter(a=>a.okr_companhia_id==co.id).map(a=>`<div class="kr-row"><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${a.nome}</div><div style="font-size:10px;color:var(--gray-mid)">${a.area} · 👤 ${a.responsavel||'—'}</div></div><span class="pw">${pc}%</span><div style="min-width:120px">${pb(a.progresso)}<div style="text-align:right;font-size:10px;font-weight:700;margin-top:1px">${a.progresso||0}%</div></div>${hbdg(a.saude||'green')}</div>`).join('')||'<div style="font-size:11px;color:var(--gray-mid);padding:6px">Nenhum OKR de Área vinculado.</div>'}</div></div>`}).join('')}
function mNovoCOkr(){openM(`<div class="md"><div class="mh"><div class="mt">Novo OKR Companhia</div><button class="mc2" onclick="closeM()">×</button></div><div class="mbd"><div class="fg"><label class="flb">Nome do Objetivo *</label><input class="fi" id="mn" placeholder="Ex: Faturar R$100M em 2026"/></div><div class="fg"><label class="flb">Descrição</label><textarea class="fta" id="md2" placeholder="Descreva o objetivo..."></textarea></div><div class="fr"><div class="fg"><label class="flb">Responsável</label><select class="fsl" id="mr2">${uOpts('')}</select></div><div class="fg"><label class="flb">Data Início</label><input class="fi" id="mi" type="date"/></div></div><div class="fg"><label class="flb">Data Fim</label><input class="fi" id="mf" type="date"/></div></div><div class="mf"><button class="btn bg" onclick="closeM()">Cancelar</button><button class="btn bp" id="bsc2" onclick="svCOkr()">💾 Salvar</button></div></div>`)}
async function svCOkr(){const btn=document.getElementById('bsc2');const n=document.getElementById('mn').value.trim();if(!n){toast('Informe o nome','err');return}btn.disabled=true;btn.textContent='Salvando...';const r=await apiP('okr_companhia',{nome:n,descricao:document.getElementById('md2').value,responsavel:document.getElementById('mr2').value,data_inicio:document.getElementById('mi').value,data_fim:document.getElementById('mf').value});if(r.ok){toast('OKR criado! ✅');closeM();DB.cokrs=await apiG('okr_companhia');lCOkr()}else{toast('Erro: '+(r.erro||''),'err');btn.disabled=false;btn.textContent='💾 Salvar'}}

function lAOkr(){const af=document.getElementById('fa-ao')?.value||'';const el=document.getElementById('aol');if(!el)return;const ft=af?DB.aokrs.filter(o=>o.area===af):DB.aokrs;if(!ft.length){el.innerHTML='<div style="background:var(--white);border:1px solid var(--border);border-radius:11px;padding:36px;text-align:center;color:var(--gray-mid)">Nenhum OKR de área'+(af?' para '+af:'')+' cadastrado.</div>';return}const areas=[...new Set(ft.map(o=>o.area).filter(Boolean))];el.innerHTML=areas.map(area=>`<div style="margin-bottom:18px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:7px"><div style="width:3px;height:15px;background:var(--orange);border-radius:2px"></div><div style="font-size:13px;font-weight:800">${area}</div></div>${ft.filter(o=>o.area===area).map(ao=>{const krs=DB.krs.filter(k=>k.okr_area_id==ao.id);const pk=krs.length>0?peso(krs.length):0;return`<div class="oi" style="margin-bottom:6px"><div class="oh" onclick="tog('a${ao.id}')"><span class="chv" id="cv-a${ao.id}">▶</span><div style="flex:1;min-width:0"><div class="on">${ao.nome}</div><div class="om"><span>👤 ${ao.responsavel||'—'}</span><span style="color:var(--blue);font-size:10px">→ ${DB.cokrs.find(c=>c.id==ao.okr_companhia_id)?.nome||'—'}</span>${bdg(ao.status||'Pendente')}<span class="pw">${krs.length} KR${krs.length!==1?'s':''} · ${pk}% cada</span></div></div><div style="display:flex;align-items:center;gap:7px;min-width:170px">${pb(ao.progresso)}<span style="font-size:12px;font-weight:800;min-width:30px;text-align:right">${ao.progresso||0}%</span></div></div><div class="oc" id="oc-a${ao.id}"><div style="font-size:9px;font-weight:700;color:var(--gray-mid);text-transform:uppercase;margin-bottom:6px">Key Results — peso: ${pk}% cada</div>${krs.map(k=>{const inits=DB.inits.filter(i=>i.kr_id==k.id&&i.status!=='Cancelada');return`<div class="kr-row"><span class="bdg ${k.tipo==='KPI'?'bb':'bor'}">${k.tipo}</span><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${k.nome}</div><div style="font-size:10px;color:var(--gray-mid)">${k.tipo==='KPI'?`${k.indicador} · ${k.unidade} ${parseFloat(k.atual||0).toLocaleString('pt-BR')}/${parseFloat(k.meta||0).toLocaleString('pt-BR')}`:`${inits.length} inic.`}</div></div><span class="pw">${pk}%</span><div style="min-width:120px">${pb(k.progresso)}<div style="text-align:right;font-size:10px;font-weight:700;margin-top:1px">${k.progresso||0}%</div></div>${hbdg(k.saude||'green')}</div>`}).join('')||'<div style="font-size:11px;color:var(--gray-mid);padding:6px">Sem KRs cadastrados.</div>'}</div></div>`}).join('')}</div>`).join('')}

async function pMaint(){document.getElementById('main').innerHTML=`<div class="ph"><div><div class="pt">Atualizar Status</div><div class="ps">Snapshots mensais — progresso recalculado automaticamente em cascata</div></div></div><div class="cnt"><div class="fb" style="align-items:flex-end;gap:12px;flex-wrap:wrap"><div><div class="fl" style="margin-bottom:4px">📅 Mês de Referência *</div><div style="display:flex;gap:6px"><select class="fs" id="mfm">${mesOpts(new Date().getMonth()+1)}</select><select class="fs" id="mfa2">${anoOpts()}</select></div></div><div><div class="fl" style="margin-bottom:4px">🏬 Área</div><select class="fs" id="mfar" onchange="lMaint()"></select></div><button class="btn bg bsm" onclick="lMaint()">🔍 Carregar</button></div><div id="mc4">${ld()}</div></div>`;await loadAll();document.getElementById('mfar').innerHTML=aOpts('','Todas');lMaint()}
async function lMaint(){const el=document.getElementById('mc4');if(!el)return;el.innerHTML=ld();const mes=parseInt(document.getElementById('mfm')?.value)||new Date().getMonth()+1;const ano=parseInt(document.getElementById('mfa2')?.value)||new Date().getFullYear();const area=document.getElementById('mfar')?.value||'';const ml=`${MOS[mes-1]}/${ano}`;[DB.krs,DB.inits,DB.aokrs,DB.snaps]=await Promise.all([apiG('key_results'),apiG('iniciativas'),apiG('okr_area'),apiG('snapshots')]);const kpis=DB.krs.filter(k=>k.tipo==='KPI'&&(!area||DB.aokrs.find(o=>o.id==k.okr_area_id)?.area===area));const ai=DB.krs.filter(k=>!area||DB.aokrs.find(o=>o.id==k.okr_area_id)?.area===area).flatMap(kr=>DB.inits.filter(i=>i.kr_id==kr.id));
el.innerHTML=`<div style="background:var(--blue-light);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:11px;color:var(--blue)">💡 <strong>Cálculo automático em cascata:</strong> KPI crescente = valor÷meta×100 · KPI decrescente = meta÷valor×100 (ex: inadimplência 5%÷6,2% = 80,6%) · Ao gravar, o progresso sobe automaticamente até o OKR Companhia.</div>
<div style="font-size:12px;font-weight:700;margin-bottom:9px;color:var(--gray-dark)">📊 KRs KPI — ${ml}</div>
${kpis.length?kpis.map(k=>{const sx=snapAteMes('kr',k.id,mes,ano);return`<div class="card" style="margin-bottom:9px"><div class="ch"><div><div class="ct">${k.nome}</div><div style="font-size:10px;color:var(--gray-mid)">${k.indicador} · Meta: ${k.unidade} ${parseFloat(k.meta||0).toLocaleString('pt-BR')} · Atual: ${parseFloat(k.atual||0).toLocaleString('pt-BR')}</div></div>${hbdg(k.saude||'green')}</div><div class="cb"><div class="fr3"><div class="fg"><label class="flb">Valor em ${ml}</label><input class="fi" type="number" id="kc-${k.id}" value="${sx?.valor_atual??k.atual??0}" step="0.01"/></div><div class="fg"><label class="flb">Meta</label><input class="fi" type="number" id="km-${k.id}" value="${sx?.meta??k.meta??0}" step="0.01"/></div><div class="fg"><label class="flb">Saúde em ${ml}</label><select class="fsl" id="ks-${k.id}"><option value="green"${(sx?.saude||k.saude)==='green'?' selected':''}>✅ No prazo</option><option value="yellow"${(sx?.saude||k.saude)==='yellow'?' selected':''}>⚠️ Atenção</option><option value="red"${(sx?.saude||k.saude)==='red'?' selected':''}>🔴 Em risco</option></select></div></div><div class="fg"><label class="flb">Comentário</label><input class="fi" id="kcom-${k.id}" value="${sx?.comentario||''}" placeholder="Observações de ${ml}..."/></div></div></div>`}).join(''):'<div style="background:var(--gray-lighter);border-radius:7px;padding:12px;text-align:center;color:var(--gray-mid);margin-bottom:12px">Nenhum KR KPI para esta seleção.</div>'}

${ai.length?ai.map(i=>{const sx=snapAteMes('iniciativa',i.id,mes,ano);return`<div class="card" style="margin-bottom:7px"><div class="ch"><div><div class="ct">${i.nome}</div><div style="font-size:10px;color:var(--gray-mid)">Prazo: ${i.data_fim||'—'} · Status atual: ${i.status||'Não iniciada'}</div></div>${bdg(sx?.status||i.status||'Não iniciada')}</div><div class="cb"><div class="fr"><div class="fg"><label class="flb">Status em ${ml}</label><select class="fsl" id="is-${i.id}">${STATUS_INIT.map(s=>`<option${(sx?.status||i.status)===s?' selected':''}>${s}</option>`).join('')}</select></div><div class="fg"><label class="flb">Comentário</label><input class="fi" id="ic-${i.id}" value="${sx?.comentario||''}" placeholder="O que aconteceu em ${ml}?"/></div></div></div></div>`}).join(''):'<div style="background:var(--gray-lighter);border-radius:7px;padding:12px;text-align:center;color:var(--gray-mid)">Nenhuma iniciativa para esta seleção.</div>'}
${(kpis.length||ai.length)?`<div style="margin-top:16px;padding-top:12px;border-top:2px solid var(--border);display:flex;justify-content:flex-end"><button class="btn bp" style="font-size:13px;padding:9px 20px" id="btn-grav" onclick="gravarTodos(${JSON.stringify(kpis.map(k=>k.id)).replace(/"/g,'&quot;')},${JSON.stringify(ai.map(i=>i.id)).replace(/"/g,'&quot;')},${mes},${ano})">💾 Gravar todos os snapshots de ${ml} e recalcular cascata</button></div>`:''}`;
}
async function gravarTodos(kpiIds,initIds,mes,ano){const btn=document.getElementById('btn-grav');btn.disabled=true;btn.textContent='Gravando e recalculando...';const ml=`${MOS[mes-1]}/${ano}`;let ok=0,err=0;
for(const id of kpiIds){const k=DB.krs.find(x=>x.id==id);if(!k)continue;const v=parseFloat(document.getElementById(`kc-${id}`)?.value)||0;const m=parseFloat(document.getElementById(`km-${id}`)?.value)||1;const s=document.getElementById(`ks-${id}`)?.value||'green';const c=document.getElementById(`kcom-${id}`)?.value||'';const p=k.indicador==='decrescente'?Math.min(Math.round((m/v)*100),100):Math.min(Math.round((v/m)*100),100);const r=await apiSnap({tipo:'kr',item_id:id,mes,ano,valor_atual:v,meta:m,saude:s,pct:p,comentario:c,status:''});r.ok?ok++:err++}
for(const id of initIds){const i=DB.inits.find(x=>x.id==id);if(!i)continue;const s=document.getElementById(`is-${id}`)?.value||i.status;const c=document.getElementById(`ic-${id}`)?.value||'';const p=PCT_STATUS[s]||0;const r=await apiSnap({tipo:'iniciativa',item_id:id,mes,ano,status:s,pct:p,comentario:c,valor_atual:'',meta:'',saude:'green'});r.ok?ok++:err++}
await loadAll();
for(const ao of DB.aokrs){const p=calcAOKR(ao,mes,ano);await apiSnap({tipo:'okr_area',item_id:ao.id,mes,ano,pct:p,status:'',valor_atual:'',meta:'',saude:p>=60?'green':p>=40?'yellow':'red',comentario:''})}
for(const co of DB.cokrs){const p=calcCOKR(co,mes,ano);await apiSnap({tipo:'okr_companhia',item_id:co.id,mes,ano,pct:p,status:'',valor_atual:'',meta:'',saude:p>=60?'green':p>=40?'yellow':'red',comentario:''})}
if(err===0){toast(`✅ ${ok} snapshots gravados para ${ml}! Cascata recalculada.`)}else{toast(`⚠️ ${ok} gravados, ${err} com erro.`,'err')}
btn.disabled=false;btn.textContent=`💾 Gravar todos os snapshots de ${ml} e recalcular cascata`}

// APROVAÇÕES
async function pApprov(){document.getElementById('main').innerHTML=`<div class="ph"><div><div class="pt">Aprovações</div><div class="ps">Fluxo de aprovação</div></div></div><div class="cnt"><div class="tabs"><div class="tab active" onclick="lApprov('Pendente',this)">Pendentes</div><div class="tab" onclick="lApprov('Aprovado',this)">Aprovados</div><div class="tab" onclick="lApprov('Reprovado',this)">Reprovados</div></div><div id="al">${ld()}</div></div>`;await lApprov('Pendente',null)}
async function lApprov(f,el){if(el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}const all=await apiG('aprovacoes');const items=all.filter(a=>a.status===f);document.getElementById('bc').textContent=all.filter(a=>a.status==='Pendente').length;const cont=document.getElementById('al');if(!cont)return;if(!items.length){cont.innerHTML='<div style="text-align:center;padding:32px;color:var(--gray-mid)">✅ Nenhum item nesta categoria</div>';return}cont.innerHTML=items.map(a=>`<div style="background:var(--white);border:1px solid var(--border);border-radius:9px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:flex-start;gap:11px"><div style="width:34px;height:34px;border-radius:8px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">${a.tipo?.includes('Key')?'📊':'🏬'}</div><div style="flex:1;min-width:0"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:9px;flex-wrap:wrap"><div><div style="font-size:12px;font-weight:700;margin-bottom:2px">${a.nome}</div><div style="font-size:10px;color:var(--gray-mid)">${a.tipo} · ${a.area} · por <strong>${a.solicitante}</strong> em ${a.data}</div></div><div style="display:flex;align-items:center;gap:6px;flex-shrink:0">${bdg(a.status)}${a.status==='Pendente'?`<button class="btn bsc bsm" onclick='dApprov("${a.id}","Aprovado",${JSON.stringify(a).replace(/"/g,"&quot;")})'>✓</button><button class="btn bsd bsm" onclick='dApprov("${a.id}","Reprovado",${JSON.stringify(a).replace(/"/g,"&quot;")})'>✕</button>`:''}</div></div></div></div>`).join('')}
async function dApprov(id,dec,a){const r=await apiU('aprovacoes',{...a,id,status:dec,aprovado_por:'Admin'});if(r.ok){toast(`${dec}! ✅`);pApprov()}else toast('Erro: '+(r.erro||''),'err')}

// EXPORTAR PDF
function exportPDF(){const af=document.getElementById('fa')?.value||'';const mes=parseInt(document.getElementById('fmes')?.value)||new Date().getMonth()+1;const ano=parseInt(document.getElementById('fano')?.value)||new Date().getFullYear();const ml=`${MOS[mes-1]}/${ano}`;const aof=af?DB.aokrs.filter(o=>o.area===af):DB.aokrs;const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Segoe UI,sans-serif;padding:28px;color:#1a1f2e;font-size:12px}h1{font-size:18px;font-weight:700;margin-bottom:3px}h2{font-size:13px;font-weight:700;margin:16px 0 7px;color:#2d3142}.bar{height:7px;background:#eee;border-radius:3px;margin:3px 0}.fill{height:7px;border-radius:3px}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;padding:7px;background:#f9fafb;border-radius:5px}table{width:100%;border-collapse:collapse;margin-bottom:14px}th{background:#f3f4f6;padding:6px 9px;text-align:left;font-size:9px;font-weight:700;text-transform:uppercase}td{padding:6px 9px;border-bottom:1px solid #e5e7eb}.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;border-bottom:2px solid #e8621a;padding-bottom:13px}</style></head><body><div class="hdr"><div><h1>OKR Suite Piacentini</h1><div style="color:#6b7280">Relatório Executivo — ${ml}${af?' · Área: '+af:''}</div></div><div style="text-align:right;color:#6b7280;font-size:10px">Gerado em ${new Date().toLocaleDateString('pt-BR')}</div></div><h2>OKRs da Companhia</h2>${DB.cokrs.map(co=>{const p=calcCOKR(co,mes,ano);return`<div class="row"><div style="flex:1"><strong>${co.nome}</strong><div style="color:#6b7280;font-size:10px">👤 ${co.responsavel||'—'}</div></div><div style="min-width:180px;margin:0 13px"><div class="bar"><div class="fill" style="width:${p}%;background:${p>=60?'#16a34a':p>=40?'#d97706':'#dc2626'}"></div></div></div><strong style="color:${p>=60?'#16a34a':p>=40?'#d97706':'#dc2626'}">${p}%</strong></div>`}).join('')}<h2>OKRs por Área — ${ml}</h2><table><thead><tr><th>OKR Área</th><th>Área</th><th>Responsável</th><th>Progresso</th></tr></thead><tbody>${aof.map(ao=>{const p=calcAOKR(ao,mes,ano);return`<tr><td>${ao.nome}</td><td>${ao.area}</td><td>${ao.responsavel||'—'}</td><td>${p}%</td></tr>`}).join('')}</tbody></table><h2>Key Results — ${ml}</h2><table><thead><tr><th>KR</th><th>Tipo</th><th>Área</th><th>Progresso</th></tr></thead><tbody>${DB.krs.filter(k=>!af||DB.aokrs.find(o=>o.id==k.okr_area_id)?.area===af).map(k=>{const p=calcKR(k,mes,ano);return`<tr><td>${k.nome}</td><td>${k.tipo}</td><td>${DB.aokrs.find(o=>o.id==k.okr_area_id)?.area||'—'}</td><td>${p}%</td></tr>`}).join('')}</tbody></table></body></html>`;const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`OKR_${ml.replace('/','_')}${af?'_'+af:''}.html`;a.click();URL.revokeObjectURL(url);toast('Relatório gerado! Abra e use Ctrl+P para salvar como PDF. ✅')}

// INIT
loadAll().then(()=>go('dashboard'));
</script>
</body>
